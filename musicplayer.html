<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octo Music - Spotify Pro Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #121212;
      --bg-highlight: #282828;
      --primary: #1db954;
      --primary-hover: #1ed760;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --border-color: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .app-container { display: flex; flex: 1; height: calc(100vh - 90px); overflow: hidden; padding: 8px; gap: 8px; }

    /* Sidebar */
    .sidebar { width: 240px; background-color: var(--bg-surface); border-radius: 8px; padding: 20px 14px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .brand { font-size: 18px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    .brand i { color: var(--primary); font-size: 22px; }
    
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .nav-item { color: var(--text-sub); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; gap: 14px; align-items: center; padding: 8px 10px; border-radius: 4px; transition: color 0.2s; }
    .nav-item:hover, .nav-item.active { color: var(--text-main); }
    .nav-item.active { background: #242424; }

    .sidebar-divider { height: 1px; background: var(--border-color); margin: 4px 0; }
    
    .action-btn { width: 100%; padding: 10px; border-radius: 20px; border: none; background: var(--primary); color: #000; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s; }
    .action-btn:hover { transform: scale(1.02); background: var(--primary-hover); }

    .user-playlists-section h4 { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
    .playlist-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .playlist-item { color: var(--text-sub); font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 10px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; transition: color 0.2s; }
    .playlist-item:hover, .playlist-item.active { color: var(--text-main); background: #1a1a1a; }
    .playlist-item .pl-info { display: flex; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .playlist-item img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }

    /* Main Content Area */
    .main-content { flex: 1; background: linear-gradient(to bottom, #203529 0%, var(--bg-surface) 320px); border-radius: 8px; overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    
    .search-box { position: relative; width: 300px; }
    .search-box input { width: 100%; padding: 10px 16px 10px 38px; border-radius: 500px; border: none; background: #242424; color: var(--text-main); font-size: 13px; outline: none; }
    .search-box input:focus { outline: 2px solid #fff; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 13px; }

    .hero-banner { display: flex; align-items: center; gap: 24px; margin-bottom: 28px; }
    .hero-banner img { width: 120px; height: 120px; border-radius: 8px; object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .hero-banner h1 { font-size: 32px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
    .hero-banner p { color: var(--text-sub); font-size: 13px; }

    /* View Containers */
    .view-container { display: flex; flex-direction: column; gap: 20px; }
    .view-container.hidden { display: none; }

    /* Track Grid */
    .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .track-card { background: #181818; padding: 14px; border-radius: 6px; cursor: pointer; transition: background 0.2s; position: relative; display: flex; flex-direction: column; }
    .track-card:hover { background: #282828; }
    
    .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 4px; overflow: hidden; margin-bottom: 12px; background: #000; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .play-btn-overlay { position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; opacity: 0; transform: translateY(8px); transition: all 0.2s ease; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    .track-card:hover .play-btn-overlay { opacity: 1; transform: translateY(0); }

    .add-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s; z-index: 5; }
    .track-card:hover .add-btn { opacity: 1; }
    .add-btn:hover { background: var(--primary); color: #000; }

    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .card-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Lyrics View Styling */
    .lyrics-view { background: linear-gradient(180deg, #1e1e1e 0%, #121212 100%); border-radius: 8px; padding: 40px; min-height: 350px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .lyrics-title { font-size: 16px; color: var(--primary); font-weight: 700; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    .lyrics-content { font-size: 22px; font-weight: 800; line-height: 1.8; color: #fff; max-width: 600px; white-space: pre-line; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #282828; border: 1px solid var(--border-color); padding: 24px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 16px 32px rgba(0,0,0,0.8); }
    .modal h3 { font-size: 16px; font-weight: 700; }
    .modal select, .modal input[type="text"], .modal input[type="file"] { width: 100%; padding: 10px; border-radius: 4px; border: none; background: #121212; color: #fff; font-size: 13px; outline: none; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .modal-btns button { padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; }
    .btn-cancel { background: transparent; color: var(--text-sub); }
    .btn-cancel:hover { color: #fff; }
    .btn-confirm { background: var(--primary); color: #000; }

    /* Bottom Player Bar */
    .player-bar { height: 90px; background: var(--bg-base); border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .player-left { display: flex; align-items: center; gap: 14px; width: 30%; }
    .player-left img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: #181818; }
    .player-left .title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-left .artist { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 40%; }
    .controls { display: flex; gap: 20px; align-items: center; }
    .controls button { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 16px; transition: color 0.2s; }
    .controls button:hover { color: var(--text-main); }
    .controls .play-pause { width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform 0.1s; }
    .controls .play-pause:hover { transform: scale(1.05); }

    .progress-track { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 450px; font-size: 11px; color: var(--text-sub); font-weight: 600; }
    .progress-bar { flex: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
    .progress-fill { height: 100%; background: #fff; width: 0%; border-radius: 2px; transition: background 0.2s; }
    .progress-bar:hover .progress-fill { background: var(--primary); }

    .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 14px; width: 30%; }
    .speed-select { background: #242424; color: var(--text-main); border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; outline: none; }
    .lyrics-toggle-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 16px; transition: color 0.2s; }
    .lyrics-toggle-btn:hover, .lyrics-toggle-btn.active { color: var(--primary); }
    
    .state-msg { text-align: center; grid-column: 1 / -1; padding: 60px 0; color: var(--text-sub); font-size: 14px; }
  </style>
</head>
<body>

  <!-- Modal: Add to Playlist -->
  <div class="modal-overlay" id="addPlaylistModal">
    <div class="modal">
      <h3>Add to Playlist</h3>
      <select id="modalPlaylistSelect"></select>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" id="modalConfirmBtn">Add</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create Playlist -->
  <div class="modal-overlay" id="createPlaylistModal">
    <div class="modal">
      <h3>Create Playlist</h3>
      <input type="text" id="newPlaylistNameInput" placeholder="Playlist name..." />
      <label style="font-size: 11px; color: var(--text-sub);">Cover Image (Optional):</label>
      <input type="file" id="playlistImageInput" accept="image/*" />
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
        <button class="btn-confirm" id="confirmCreatePlaylistBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><i class="fa-brands fa-spotify"></i> Octo Music</div>
      <ul class="nav-list">
        <li class="nav-item active" id="navHome"><i class="fa-solid fa-house"></i> Home</li>
      </ul>
      <div class="sidebar-divider"></div>
      <button class="action-btn" id="openCreateModalBtn"><i class="fa-solid fa-plus"></i> Create Playlist</button>
      <div class="user-playlists-section" style="margin-top: 12px;">
        <h4>Playlists</h4>
        <ul class="playlist-list" id="playlistList"></ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="What do you want to play?" />
        </div>
      </div>

      <div class="hero-banner">
        <img id="bannerImg" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60" />
        <div>
          <h1 id="feedTitle">Soundcharts Hub</h1>
          <p id="feedSub">Instant metadata load • Audio streams on click</p>
        </div>
      </div>

      <!-- Grid View -->
      <div class="view-container" id="gridViewContainer">
        <div class="track-grid" id="trackGrid">
          <div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading track list & metadata...</div>
        </div>
      </div>

      <!-- Lyrics View -->
      <div class="view-container hidden" id="lyricsViewContainer">
        <div class="lyrics-view">
          <div class="lyrics-title">Synchronized Lyrics</div>
          <div class="lyrics-content" id="lyricsText">Select a song to display live lyrics.</div>
        </div>
      </div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="player-left">
      <img id="currImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' fill='%23181818'><rect width='56' height='56'/></svg>" />
      <div>
        <div class="title" id="currTitle">No track playing</div>
        <div class="artist" id="currArtist">-</div>
      </div>
    </div>
    
    <div class="player-center">
      <div class="controls">
        <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-pause" id="playBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-track">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <select class="speed-select" id="playbackSpeed">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x Normal</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>
      <button class="lyrics-toggle-btn" id="lyricsToggleBtn" title="Toggle Lyrics"><i class="fa-solid fa-microphone-lines"></i></button>
    </div>
  </footer>

  <audio id="audioEngine" preload="none"></audio>

  <script>
    const REPO_USER = 'CalcSolver';
    const REPO_NAME = 'OctoArcade';
    const BRANCH = 'main';
    const FOLDER_NAME = 'Songs/MP3s';

    // Multi-CDN gateways (no raw githack)
    const CDN_PROVIDERS = [
      (filePath) => `https://cdn.jsdelivr.net/gh/${REPO_USER}/${REPO_NAME}@${BRANCH}/${filePath}`,
      (filePath) => `https://cdn.statically.io/gh/${REPO_USER}/${REPO_NAME}/${BRANCH}/${filePath}`,
      (filePath) => `https://fastly.jsdelivr.net/gh/${REPO_USER}/${REPO_NAME}@${BRANCH}/${filePath}`
    ];

    // Soundcharts API v2.25 Metadata Cache mapping
    const SOUNDCHARTS_METADATA_CACHE = {
      "ballroomblitz": {
        "object": {
          "name": "Ballroom Blitz",
          "creditName": "Sweet",
          "imageUrl": "https://upload.wikimedia.org/wikipedia/en/2/27/Sweet_Ballroom_Blitz_single_cover.jpg",
          "lyrics": "Are you ready, Steve?\nUh-huh\nAndy? Yeah\nScotty? Ready\nAll right, fellas, let's go!"
        }
      },
      "alliwantforchristmasisyou": {
        "object": {
          "name": "All I Want for Christmas Is You",
          "creditName": "Mariah Carey",
          "imageUrl": "https://assets.soundcharts.com/song/b/2/5/11e82612-052b-f4f4-a20c-a0369fe50396.jpg",
          "lyrics": "I don't want a lot for Christmas\nThere is just one thing I need\nI don't care about the presents\nUnderneath the Christmas tree"
        }
      }
    };

    let libraryTracks = [];
    let userPlaylists = JSON.parse(localStorage.getItem('octo_playlists') || '{"Favorites": {"tracks": [], "image": ""}}');
    let activePlaylist = null;
    let currentTracks = [];
    let currentIndex = -1;
    let isPlaying = false;
    let trackToAdd = null;
    let isLyricsMode = false;
    let playRequestToken = 0;

    const audio = document.getElementById('audioEngine');
    const trackGrid = document.getElementById('trackGrid');
    const searchInput = document.getElementById('searchInput');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const currTitle = document.getElementById('currTitle');
    const currArtist = document.getElementById('currArtist');
    const currImg = document.getElementById('currImg');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const playlistList = document.getElementById('playlistList');
    const playbackSpeed = document.getElementById('playbackSpeed');
    const lyricsToggleBtn = document.getElementById('lyricsToggleBtn');
    const gridViewContainer = document.getElementById('gridViewContainer');
    const lyricsViewContainer = document.getElementById('lyricsViewContainer');
    const lyricsText = document.getElementById('lyricsText');

    Object.keys(userPlaylists).forEach(k => {
      if (Array.isArray(userPlaylists[k])) {
        userPlaylists[k] = { tracks: userPlaylists[k], image: "" };
      }
    });

    function savePlaylists() {
      localStorage.setItem('octo_playlists', JSON.stringify(userPlaylists));
      renderPlaylists();
    }

    function renderPlaylists() {
      playlistList.innerHTML = '';
      Object.keys(userPlaylists).forEach(name => {
        const plData = userPlaylists[name];
        const li = document.createElement('li');
        li.className = `playlist-item ${activePlaylist === name ? 'active' : ''}`;
        li.innerHTML = `
          <div class="pl-info" style="flex:1;">
            <img src="${plData.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=60'}" />
            <span>${name}</span>
          </div>
          <i class="fa-solid fa-trash" style="font-size:11px; color:var(--text-sub); padding:4px;" title="Delete"></i>
        `;
        
        li.onclick = (e) => {
          if (!e.target.classList.contains('fa-trash')) openPlaylist(name);
        };

        li.querySelector('.fa-trash').onclick = (e) => {
          e.stopPropagation();
          if (confirm(`Delete playlist "${name}"?`)) {
            delete userPlaylists[name];
            savePlaylists();
            if (activePlaylist === name) loadGitHubLibrary();
          }
        };

        playlistList.appendChild(li);
      });
    }

    // Loads only name + metadata right away (zero audio network requests on startup)
    function parseTrackMetadata(fileObj) {
      const cleanSlug = fileObj.name.toLowerCase().replace(/[^a-z0-9]/g, '');
      const cached = SOUNDCHARTS_METADATA_CACHE[cleanSlug];

      if (cached && cached.object) {
        return {
          title: cached.object.name,
          artist: cached.object.creditName || "Unknown Artist",
          cover: cached.object.imageUrl,
          lyrics: cached.object.lyrics || "No synchronized lyrics available for this track."
        };
      }

      let cleanName = fileObj.name.replace(/\.[^/.]+$/, "").replace(/[_]/g, " ");
      let parts = cleanName.split(' - ');
      return {
        title: parts.length > 1 ? parts[1] : parts[0],
        artist: parts.length > 1 ? parts[0] : 'Unknown Artist',
        cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60',
        lyrics: "Instrumental or lyrics not found."
      };
    }

    async function autoDiscoverMP3s() {
      activePlaylist = null;
      renderPlaylists();
      trackGrid.innerHTML = '<div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading names & metadata...</div>';

      try {
        const apiRes = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${FOLDER_NAME}`);
        if (!apiRes.ok) throw new Error('API limit or repo private');
        
        const files = await apiRes.json();
        const mp3Files = files.filter(f => f.name.toLowerCase().includes('.mp3'));

        if (mp3Files.length === 0) {
          trackGrid.innerHTML = `<div class="state-msg">No files found in <code>${FOLDER_NAME}/</code>.</div>`;
          return;
        }

        libraryTracks = mp3Files.map(file => {
          const meta = parseTrackMetadata(file);
          const repoPath = `${FOLDER_NAME}/${file.name}`;
          return {
            fileName: file.name,
            repoPath: repoPath,
            title: meta.title,
            artist: meta.artist,
            cover: meta.cover,
            lyrics: meta.lyrics,
            audio: null // Loaded lazily on click
          };
        });

        currentTracks = libraryTracks;
        renderGrid(currentTracks);
      } catch (err) {
        console.error(err);
        trackGrid.innerHTML = '<div class="state-msg">Failed to load library items.</div>';
      }
    }

    // Resolves audio stream only when the user actually clicks/plays the track
    async function resolveAudioUrlOnDemand(track) {
      if (track.audio) return track.audio;

      for (const buildUrl of CDN_PROVIDERS) {
        const candidate = buildUrl(track.repoPath);
        try {
          const res = await fetch(candidate, { method: 'HEAD' });
          if (res.ok) {
            track.audio = candidate;
            return candidate;
          }
        } catch (e) {}
      }

      // Direct stream fallback to first CDN without blocking playback
      track.audio = CDN_PROVIDERS[0](track.repoPath);
      return track.audio;
    }

    function loadGitHubLibrary() {
      activePlaylist = null;
      document.getElementById('feedTitle').textContent = "Soundcharts Hub";
      document.getElementById('feedSub').textContent = "Instant metadata load • Audio streams on click";
      document.getElementById('bannerImg').src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60";
      currentTracks = libraryTracks;
      renderGrid(currentTracks);
      renderPlaylists();
    }

    function openPlaylist(name) {
      activePlaylist = name;
      renderPlaylists();
      currentTracks = userPlaylists[name].tracks || [];
      document.getElementById('feedTitle').textContent = name;
      document.getElementById('feedSub').textContent = `${currentTracks.length} songs`;
      if (userPlaylists[name].image) {
        document.getElementById('bannerImg').src = userPlaylists[name].image;
      } else {
        document.getElementById('bannerImg').src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60";
      }
      renderGrid(currentTracks);
    }

    function renderGrid(tracks) {
      trackGrid.innerHTML = '';
      if (tracks.length === 0) {
        trackGrid.innerHTML = '<div class="state-msg">No tracks available in this view.</div>';
        return;
      }

      tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <button class="add-btn" title="Add to Playlist"><i class="fa-solid fa-plus"></i></button>
          <div class="card-img-wrap">
            <img src="${track.cover}" loading="lazy" />
            <div class="play-btn-overlay"><i class="fa-solid fa-play"></i></div>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;

        card.onclick = (e) => {
          if (!e.target.closest('.add-btn')) playTrack(index);
        };

        card.querySelector('.add-btn').onclick = (e) => {
          e.stopPropagation();
          openAddModal(track);
        };

        trackGrid.appendChild(card);
      });
    }

    function openAddModal(track) {
      trackToAdd = track;
      const select = document.getElementById('modalPlaylistSelect');
      select.innerHTML = '';
      Object.keys(userPlaylists).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      document.getElementById('addPlaylistModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('addPlaylistModal').style.display = 'none';
      trackToAdd = null;
    }

    document.getElementById('modalConfirmBtn').onclick = () => {
      const target = document.getElementById('modalPlaylistSelect').value;
      if (target && trackToAdd) {
        if (!userPlaylists[target].tracks.some(t => t.repoPath === trackToAdd.repoPath)) {
          userPlaylists[target].tracks.push(trackToAdd);
          savePlaylists();
        }
      }
      closeModal();
    };

    document.getElementById('openCreateModalBtn').onclick = () => {
      document.getElementById('newPlaylistNameInput').value = '';
      document.getElementById('playlistImageInput').value = '';
      document.getElementById('createPlaylistModal').style.display = 'flex';
    };

    function closeCreateModal() {
      document.getElementById('createPlaylistModal').style.display = 'none';
    }

    document.getElementById('confirmCreatePlaylistBtn').onclick = () => {
      const name = document.getElementById('newPlaylistNameInput').value.trim();
      const fileInput = document.getElementById('playlistImageInput');
      
      if (!name || userPlaylists[name]) return;

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          userPlaylists[name] = { tracks: [], image: e.target.result };
          savePlaylists();
          closeCreateModal();
          openPlaylist(name);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        userPlaylists[name] = { tracks: [], image: "" };
        savePlaylists();
        closeCreateModal();
        openPlaylist(name);
      }
    };

    async function playTrack(index) {
      if (index < 0 || index >= currentTracks.length) return;
      const requestId = ++playRequestToken;
      currentIndex = index;
      const track = currentTracks[currentIndex];

      // Update UI immediately on click
      currTitle.textContent = track.title;
      currArtist.textContent = `${track.artist} • Loading audio...`;
      currImg.src = track.cover;
      lyricsText.textContent = track.lyrics || "No lyrics available.";
      playIcon.className = "fa-solid fa-spinner fa-spin";

      // Resolve and load audio file only now
      const streamUrl = await resolveAudioUrlOnDemand(track);
      if (requestId !== playRequestToken) return; // User clicked another track while loading

      audio.src = streamUrl;
      audio.playbackRate = parseFloat(playbackSpeed.value);
      audio.load();

      audio.play().then(() => {
        if (requestId !== playRequestToken) return;
        isPlaying = true;
        currArtist.textContent = track.artist;
        playIcon.className = "fa-solid fa-pause";
      }).catch(err => {
        console.error(err);
        isPlaying = false;
        currArtist.textContent = track.artist;
        playIcon.className = "fa-solid fa-play";
      });
    }

    playBtn.onclick = () => {
      if (!audio.src && currentTracks.length > 0) { playTrack(0); return; }
      if (isPlaying) {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        isPlaying = false;
      } else {
        audio.play().then(() => {
          playIcon.className = "fa-solid fa-pause";
          isPlaying = true;
        }).catch(err => console.error(err));
      }
    };

    playbackSpeed.onchange = (e) => {
      audio.playbackRate = parseFloat(e.target.value);
    };

    lyricsToggleBtn.onclick = () => {
      isLyricsMode = !isLyricsMode;
      if (isLyricsMode) {
        lyricsToggleBtn.classList.add('active');
        gridViewContainer.classList.add('hidden');
        lyricsViewContainer.classList.remove('hidden');
      } else {
        lyricsToggleBtn.classList.remove('active');
        lyricsViewContainer.classList.add('hidden');
        gridViewContainer.classList.remove('hidden');
      }
    };

    document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) playTrack(currentIndex - 1); };
    document.getElementById('nextBtn').onclick = () => { if (currentIndex < currentTracks.length - 1) playTrack(currentIndex + 1); };

    audio.ontimeupdate = () => {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('duration').textContent = formatTime(audio.duration);
      }
    };

    audio.onended = () => { if (currentIndex < currentTracks.length - 1) playTrack(currentIndex + 1); };

    progressBar.onclick = (e) => {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / progressBar.offsetWidth) * audio.duration;
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('navHome').onclick = () => {
      if (isLyricsMode) lyricsToggleBtn.click();
      loadGitHubLibrary();
    };

    searchInput.oninput = (e) => {
      const term = e.target.value.toLowerCase();
      const source = activePlaylist ? userPlaylists[activePlaylist].tracks : libraryTracks;
      const filtered = source.filter(t => t.title.toLowerCase().includes(term) || t.artist.toLowerCase().includes(term));
      renderGrid(filtered);
    };

    renderPlaylists();
    autoDiscoverMP3s();
  </script>
</body>
</html>
