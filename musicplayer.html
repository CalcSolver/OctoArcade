<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octo Music - High Velocity</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-base: #060709;
      --bg-surface: #0e1116;
      --bg-highlight: #161b22;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.2);
      --text-main: #f8fafc;
      --text-sub: #64748b;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .app-container { display: flex; flex: 1; height: calc(100vh - 88px); overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 260px; background-color: var(--bg-surface); padding: 24px 16px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid var(--border-color); overflow-y: auto; }
    .brand { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
    .brand i { color: var(--accent); font-size: 22px; filter: drop-shadow(0 0 8px var(--accent-glow)); }
    
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .nav-item { color: var(--text-sub); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 6px; transition: all 0.15s ease; }
    .nav-item:hover, .nav-item.active { color: var(--text-main); background: var(--bg-highlight); }
    .nav-item.active i { color: var(--accent); }

    .sidebar-divider { height: 1px; background: var(--border-color); margin: 4px 0; }
    
    .action-btn { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(0, 242, 254, 0.3); background: rgba(0, 242, 254, 0.08); color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s ease; }
    .action-btn:hover { background: rgba(0, 242, 254, 0.15); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

    .user-playlists-section h4 { font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
    .playlist-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .playlist-item { color: var(--text-sub); font-size: 13px; cursor: pointer; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; transition: all 0.15s ease; }
    .playlist-item:hover, .playlist-item.active { color: var(--text-main); background: var(--bg-highlight); }
    .playlist-item .pl-info { display: flex; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .playlist-item img { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; }

    /* Main Content */
    .main-content { flex: 1; background: radial-gradient(circle at top right, #0f172a 0%, var(--bg-base) 50%); overflow-y: auto; padding: 32px 40px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    
    .search-box { position: relative; width: 320px; }
    .search-box input { width: 100%; padding: 10px 16px 10px 38px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main); font-size: 13px; outline: none; transition: border-color 0.15s; }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 13px; }

    .hero-banner { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; background: var(--bg-surface); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); }
    .hero-banner img { width: 80px; height: 80px; border-radius: 6px; object-fit: cover; background: var(--bg-highlight); }
    .hero-banner h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
    .hero-banner p { color: var(--text-sub); font-size: 13px; }

    /* Track Grid */
    .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .track-card { background: var(--bg-surface); padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.15s ease; position: relative; display: flex; flex-direction: column; }
    .track-card:hover { background: var(--bg-highlight); border-color: rgba(0, 242, 254, 0.4); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    
    .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 6px; overflow: hidden; margin-bottom: 10px; background: var(--bg-base); }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .play-btn-overlay { position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; opacity: 0; transform: translateY(6px); transition: all 0.15s ease; box-shadow: 0 4px 12px var(--accent-glow); }
    .track-card:hover .play-btn-overlay { opacity: 1; transform: translateY(0); }

    .add-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: all 0.15s ease; z-index: 5; }
    .track-card:hover .add-btn { opacity: 1; }
    .add-btn:hover { background: var(--accent); color: #000; }

    .card-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .card-artist { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 24px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
    .modal h3 { font-size: 16px; font-weight: 700; }
    .modal select, .modal input[type="text"], .modal input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-base); color: #fff; font-size: 13px; outline: none; }
    .modal select:focus, .modal input:focus { border-color: var(--accent); }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .modal-btns button { padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; }
    .btn-cancel { background: var(--bg-highlight); color: var(--text-sub); }
    .btn-cancel:hover { color: #fff; }
    .btn-confirm { background: var(--accent); color: #000; }
    .btn-confirm:hover { box-shadow: 0 0 10px var(--accent-glow); }

    /* Bottom Player Bar */
    .player-bar { height: 88px; background: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .player-left { display: flex; align-items: center; gap: 14px; width: 30%; }
    .player-left img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: var(--bg-base); border: 1px solid var(--border-color); }
    .player-left .title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-left .artist { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 40%; }
    .controls { display: flex; gap: 20px; align-items: center; }
    .controls button { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 16px; transition: color 0.15s; }
    .controls button:hover { color: var(--text-main); }
    .controls .play-pause { width: 36px; height: 36px; background: var(--text-main); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform 0.15s; }
    .controls .play-pause:hover { transform: scale(1.05); }

    .progress-track { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 420px; font-size: 10px; color: var(--text-sub); font-weight: 600; }
    .progress-bar { flex: 1; height: 4px; background: var(--border-color); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 2px; box-shadow: 0 0 8px var(--accent-glow); }
    
    .state-msg { text-align: center; grid-column: 1 / -1; padding: 60px 0; color: var(--text-sub); font-size: 13px; }
  </style>
</head>
<body>

  <!-- Modal: Add to Playlist -->
  <div class="modal-overlay" id="addPlaylistModal">
    <div class="modal">
      <h3>Add Track to Playlist</h3>
      <select id="modalPlaylistSelect"></select>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" id="modalConfirmBtn">Add</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create Playlist -->
  <div class="modal-overlay" id="createPlaylistModal">
    <div class="modal">
      <h3>New Playlist</h3>
      <input type="text" id="newPlaylistNameInput" placeholder="Playlist Name..." />
      <label style="font-size: 11px; color: var(--text-sub);">Cover Photo (Optional):</label>
      <input type="file" id="playlistImageInput" accept="image/*" />
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
        <button class="btn-confirm" id="confirmCreatePlaylistBtn">Create</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-bolt"></i> Octo Music</div>
      <ul class="nav-list">
        <li class="nav-item active" id="navHome"><i class="fa-solid fa-cube"></i> Hub Library</li>
      </ul>
      <div class="sidebar-divider"></div>
      <button class="action-btn" id="openCreateModalBtn"><i class="fa-solid fa-plus"></i> New Playlist</button>
      <div class="user-playlists-section" style="margin-top: 12px;">
        <h4>Playlists</h4>
        <ul class="playlist-list" id="playlistList"></ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search tracks..." />
        </div>
      </div>

      <div class="hero-banner">
        <img id="bannerImg" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60" />
        <div>
          <h1 id="feedTitle">Soundcharts Hub</h1>
          <p id="feedSub">High-performance audio streaming interface</p>
        </div>
      </div>

      <div class="track-grid" id="trackGrid">
        <div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Syncing repository...</div>
      </div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="player-left">
      <img id="currImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='52' fill='%23161b22'><rect width='52' height='52'/></svg>" />
      <div>
        <div class="title" id="currTitle">Ready</div>
        <div class="artist" id="currArtist">Select a track</div>
      </div>
    </div>
    
    <div class="player-center">
      <div class="controls">
        <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-pause" id="playBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-track">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </div>
    <div style="width: 30%;"></div>
  </footer>

  <audio id="audioEngine"></audio>

  <script>
    const REPO_USER = 'CalcSolver';
    const REPO_NAME = 'OctoArcade';
    const BRANCH = 'main';
    const FOLDER_NAME = 'Songs/MP3s';

    // Soundcharts API v2.25 Mock Database Cache mapping
    const SOUNDCHARTS_METADATA_CACHE = {
      "ballroomblitz": {
        "object": {
          "name": "Ballroom Blitz",
          "creditName": "Sweet",
          "imageUrl": "https://upload.wikimedia.org/wikipedia/en/2/27/Sweet_Ballroom_Blitz_single_cover.jpg"
        }
      },
      "alliwantforchristmasisyou": {
        "object": {
          "name": "All I Want for Christmas Is You",
          "creditName": "Mariah Carey",
          "imageUrl": "https://assets.soundcharts.com/song/b/2/5/11e82612-052b-f4f4-a20c-a0369fe50396.jpg"
        }
      }
    };

    let libraryTracks = [];
    let userPlaylists = JSON.parse(localStorage.getItem('octo_playlists') || '{"Favorites": {"tracks": [], "image": ""}}');
    let activePlaylist = null;
    let currentTracks = [];
    let currentIndex = -1;
    let isPlaying = false;
    let trackToAdd = null;

    const audio = document.getElementById('audioEngine');
    const trackGrid = document.getElementById('trackGrid');
    const searchInput = document.getElementById('searchInput');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const currTitle = document.getElementById('currTitle');
    const currArtist = document.getElementById('currArtist');
    const currImg = document.getElementById('currImg');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const playlistList = document.getElementById('playlistList');

    Object.keys(userPlaylists).forEach(k => {
      if (Array.isArray(userPlaylists[k])) {
        userPlaylists[k] = { tracks: userPlaylists[k], image: "" };
      }
    });

    function savePlaylists() {
      localStorage.setItem('octo_playlists', JSON.stringify(userPlaylists));
      renderPlaylists();
    }

    function renderPlaylists() {
      playlistList.innerHTML = '';
      Object.keys(userPlaylists).forEach(name => {
        const plData = userPlaylists[name];
        const li = document.createElement('li');
        li.className = `playlist-item ${activePlaylist === name ? 'active' : ''}`;
        li.innerHTML = `
          <div class="pl-info" style="flex:1;">
            <img src="${plData.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=60'}" />
            <span>${name} (${plData.tracks.length})</span>
          </div>
          <i class="fa-solid fa-trash" style="font-size:11px; color:var(--text-sub); padding:4px;" title="Delete"></i>
        `;
        
        li.onclick = (e) => {
          if (!e.target.classList.contains('fa-trash')) openPlaylist(name);
        };

        li.querySelector('.fa-trash').onclick = (e) => {
          e.stopPropagation();
          if (confirm(`Delete playlist "${name}"?`)) {
            delete userPlaylists[name];
            savePlaylists();
            if (activePlaylist === name) loadGitHubLibrary();
          }
        };

        playlistList.appendChild(li);
      });
    }

    async function fetchSoundchartsMetadata(fileObj) {
      const cleanSlug = fileObj.name.toLowerCase().replace(/[^a-z0-9]/g, '');
      const cached = SOUNDCHARTS_METADATA_CACHE[cleanSlug];

      if (cached && cached.object) {
        return {
          title: cached.object.name,
          artist: cached.object.creditName || "Unknown Artist",
          cover: cached.object.imageUrl
        };
      }

      let cleanName = fileObj.name.replace(/\.[^/.]+$/, "").replace(/[_]/g, " ");
      let parts = cleanName.split(' - ');
      return {
        title: parts.length > 1 ? parts[1] : parts[0],
        artist: parts.length > 1 ? parts[0] : 'Unknown Artist',
        cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60'
      };
    }

    async function autoDiscoverMP3s() {
      activePlaylist = null;
      renderPlaylists();
      trackGrid.innerHTML = '<div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Initializing fast sync...</div>';

      try {
        const apiRes = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${FOLDER_NAME}`);
        if (!apiRes.ok) throw new Error('API limit or repo private');
        
        const files = await apiRes.json();
        const mp3Files = files.filter(f => f.name.toLowerCase().includes('.mp3'));

        if (mp3Files.length === 0) {
          trackGrid.innerHTML = `<div class="state-msg">No files found in <code>${FOLDER_NAME}/</code>.</div>`;
          return;
        }

        libraryTracks = [];
        for (const file of mp3Files) {
          const meta = await fetchSoundchartsMetadata(file);
          const audioUrl = `https://cdn.jsdelivr.net/gh/${REPO_USER}/${REPO_NAME}@${BRANCH}/${FOLDER_NAME}/${file.name}`;

          libraryTracks.push({
            title: meta.title,
            artist: meta.artist,
            cover: meta.cover,
            audio: audioUrl
          });
        }

        currentTracks = libraryTracks;
        renderGrid(currentTracks);
      } catch (err) {
        console.error(err);
        trackGrid.innerHTML = '<div class="state-msg">Failed to load library items.</div>';
      }
    }

    function loadGitHubLibrary() {
      activePlaylist = null;
      document.getElementById('feedTitle').textContent = "Soundcharts Hub";
      document.getElementById('feedSub').textContent = "High-performance audio streaming interface";
      document.getElementById('bannerImg').src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60";
      currentTracks = libraryTracks;
      renderGrid(currentTracks);
      renderPlaylists();
    }

    function openPlaylist(name) {
      activePlaylist = name;
      renderPlaylists();
      currentTracks = userPlaylists[name].tracks || [];
      document.getElementById('feedTitle').textContent = name;
      document.getElementById('feedSub').textContent = `${currentTracks.length} tracks loaded`;
      if (userPlaylists[name].image) {
        document.getElementById('bannerImg').src = userPlaylists[name].image;
      } else {
        document.getElementById('bannerImg').src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60";
      }
      renderGrid(currentTracks);
    }

    function renderGrid(tracks) {
      trackGrid.innerHTML = '';
      if (tracks.length === 0) {
        trackGrid.innerHTML = '<div class="state-msg">No tracks available.</div>';
        return;
      }

      tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <button class="add-btn" title="Add to Playlist"><i class="fa-solid fa-plus"></i></button>
          <div class="card-img-wrap">
            <img src="${track.cover}" loading="lazy" />
            <div class="play-btn-overlay"><i class="fa-solid fa-play"></i></div>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;

        card.onclick = (e) => {
          if (!e.target.closest('.add-btn')) playTrack(index);
        };

        card.querySelector('.add-btn').onclick = (e) => {
          e.stopPropagation();
          openAddModal(track);
        };

        trackGrid.appendChild(card);
      });
    }

    function openAddModal(track) {
      trackToAdd = track;
      const select = document.getElementById('modalPlaylistSelect');
      select.innerHTML = '';
      Object.keys(userPlaylists).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      document.getElementById('addPlaylistModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('addPlaylistModal').style.display = 'none';
      trackToAdd = null;
    }

    document.getElementById('modalConfirmBtn').onclick = () => {
      const target = document.getElementById('modalPlaylistSelect').value;
      if (target && trackToAdd) {
        if (!userPlaylists[target].tracks.some(t => t.audio === trackToAdd.audio)) {
          userPlaylists[target].tracks.push(trackToAdd);
          savePlaylists();
        }
      }
      closeModal();
    };

    document.getElementById('openCreateModalBtn').onclick = () => {
      document.getElementById('newPlaylistNameInput').value = '';
      document.getElementById('playlistImageInput').value = '';
      document.getElementById('createPlaylistModal').style.display = 'flex';
    };

    function closeCreateModal() {
      document.getElementById('createPlaylistModal').style.display = 'none';
    }

    document.getElementById('confirmCreatePlaylistBtn').onclick = () => {
      const name = document.getElementById('newPlaylistNameInput').value.trim();
      const fileInput = document.getElementById('playlistImageInput');
      
      if (!name || userPlaylists[name]) return;

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          userPlaylists[name] = { tracks: [], image: e.target.result };
          savePlaylists();
          closeCreateModal();
          openPlaylist(name);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        userPlaylists[name] = { tracks: [], image: "" };
        savePlaylists();
        closeCreateModal();
        openPlaylist(name);
      }
    };

    function playTrack(index) {
      currentIndex = index;
      const track = currentTracks[currentIndex];
      audio.src = track.audio;
      audio.load();
      audio.play().then(() => {
        isPlaying = true;
        playIcon.className = "fa-solid fa-pause";
      }).catch(err => console.error(err));
      
      currTitle.textContent = track.title;
      currArtist.textContent = track.artist;
      currImg.src = track.cover;
    }

    playBtn.onclick = () => {
      if (!audio.src && currentTracks.length > 0) { playTrack(0); return; }
      if (isPlaying) {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
      } else {
        audio.play();
        playIcon.className = "fa-solid fa-pause";
      }
      isPlaying = !isPlaying;
    };

    document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) playTrack(currentIndex - 1); };
    document.getElementById('nextBtn').onclick = () => { if (currentIndex < currentTracks.length - 1) playTrack(currentIndex + 1); };

    audio.ontimeupdate = () => {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('duration').textContent = formatTime(audio.duration);
      }
    };

    audio.onended = () => { if (currentIndex < currentTracks.length - 1) playTrack(currentIndex + 1); };

    progressBar.onclick = (e) => {
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / progressBar.offsetWidth) * audio.duration;
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('navHome').onclick = () => loadGitHubLibrary();

    searchInput.oninput = (e) => {
      const term = e.target.value.toLowerCase();
      const source = activePlaylist ? userPlaylists[activePlaylist].tracks : libraryTracks;
      const filtered = source.filter(t => t.title.toLowerCase().includes(term) || t.artist.toLowerCase().includes(term));
      renderGrid(filtered);
    };

    renderPlaylists();
    autoDiscoverMP3s();
  </script>
</body>
</html>
