<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octo Music - Firebase Cloud</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-base: #121212;
      --bg-surface: #181818;
      --bg-highlight: #282828;
      --primary: #1db954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --border-color: #282828;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .app-container { display: flex; flex: 1; height: calc(100vh - 90px); overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 240px; background-color: #000; padding: 24px 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
    .brand { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 12px; }
    .brand i { color: var(--primary); font-size: 24px; }
    
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .nav-item { color: var(--text-sub); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; gap: 14px; align-items: center; transition: color 0.2s; }
    .nav-item:hover, .nav-item.active { color: var(--text-main); }

    .sidebar-divider { height: 1px; background: var(--border-color); margin: 4px 0; }
    
    .action-btn { width: 100%; padding: 10px; border-radius: 20px; border: none; background: var(--primary); color: #000; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
    .action-btn:hover { opacity: 0.9; }

    .user-playlists-section h4 { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .playlist-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .playlist-item { color: var(--text-sub); font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
    .playlist-item:hover, .playlist-item.active { color: var(--text-main); }

    /* Main Area */
    .main-content { flex: 1; background: linear-gradient(to bottom, #1e3a29 0%, var(--bg-base) 350px); overflow-y: auto; padding: 24px 32px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    
    .search-box { position: relative; width: 320px; }
    .search-box input { width: 100%; padding: 10px 16px 10px 40px; border-radius: 50px; border: none; background: var(--bg-surface); color: var(--text-main); font-size: 14px; outline: none; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

    .hero-banner h1 { font-size: 32px; font-weight: 800; margin-bottom: 6px; }
    .hero-banner p { color: var(--text-sub); margin-bottom: 24px; }

    /* Upload Panel */
    .upload-panel { background: var(--bg-surface); border: 1px dashed var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
    .upload-panel input { padding: 8px 12px; background: var(--bg-base); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }

    /* Track Grid */
    .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .track-card { background: var(--bg-surface); padding: 16px; border-radius: 8px; cursor: pointer; transition: background 0.2s; position: relative; }
    .track-card:hover { background: var(--bg-highlight); }
    
    .card-img-wrap { position: relative; width: 100%; padding-top: 100%; border-radius: 6px; overflow: hidden; margin-bottom: 12px; background: #282828; }
    .card-img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    .play-btn-overlay { position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; opacity: 0; transform: translateY(8px); transition: all 0.2s; }
    .track-card:hover .play-btn-overlay { opacity: 1; transform: translateY(0); }

    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .card-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Player Bar */
    .player-bar { height: 90px; background: #000; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .player-left { display: flex; align-items: center; gap: 14px; width: 30%; }
    .player-left img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: #282828; }
    .player-left .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-left .artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
    .controls { display: flex; gap: 20px; align-items: center; }
    .controls button { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 16px; }
    .controls button:hover { color: var(--text-main); }
    .controls .play-pause { width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    .progress-track { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 400px; font-size: 11px; color: var(--text-sub); }
    .progress-bar { flex: 1; height: 4px; background: #4f4f4f; border-radius: 2px; cursor: pointer; position: relative; }
    .progress-fill { height: 100%; background: #fff; width: 0%; border-radius: 2px; }
    
    .state-msg { text-align: center; grid-column: 1 / -1; padding: 40px 0; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-compact-disc"></i> Octo Cloud</div>
      <ul class="nav-list">
        <li class="nav-item active" id="navHome"><i class="fa-solid fa-house"></i> Firebase Cloud</li>
      </ul>
      <div class="sidebar-divider"></div>
      <button class="action-btn" id="toggleUploadBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Track</button>
    </aside>

    <main class="main-content">
      <div class="hero-banner">
        <h1 id="feedTitle">Your Firebase Library</h1>
        <p>Private cloud music hosted on Firebase Storage</p>
      </div>

      <!-- Upload Interface -->
      <div class="upload-panel" id="uploadPanel" style="display: none;">
        <h3>Upload Track to Firebase</h3>
        <input type="text" id="songTitleInput" placeholder="Song Title (e.g. Thriller)" />
        <input type="text" id="songArtistInput" placeholder="Artist Name (e.g. Michael Jackson)" />
        <label style="font-size: 12px; color: var(--text-sub);">Select MP3 File:</label>
        <input type="file" id="mp3FileInput" accept="audio/mp3,audio/*" />
        <button class="action-btn" id="startUploadBtn" style="width: 150px; margin-top: 8px;">Upload Now</button>
        <div id="uploadStatus" style="font-size: 12px; color: var(--primary);"></div>
      </div>

      <div class="track-grid" id="trackGrid">
        <div class="state-msg">Connecting to Firebase...</div>
      </div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="player-left">
      <img id="currImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' fill='%23282828'><rect width='56' height='56'/></svg>" />
      <div>
        <div class="title" id="currTitle">No Track Playing</div>
        <div class="artist" id="currArtist">Select a song</div>
      </div>
    </div>
    
    <div class="player-center">
      <div class="controls">
        <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-pause" id="playBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-track">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </div>
    <div style="width: 30%;"></div>
  </footer>

  <audio id="audioEngine"></audio>

  <!-- Firebase SDK Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyASgXoiJqaGCciVZq4CnL9OaV_XOS_aNQw",
      authDomain: "music-player-c2d3e.firebaseapp.com",
      projectId: "music-player-c2d3e",
      storageBucket: "music-player-c2d3e.firebasestorage.app",
      messagingSenderId: "878608863769",
      appId: "1:878608863769:web:87c77ea56c53eb6bbf5088",
      measurementId: "G-7E2ES2Q7EZ"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    let cloudTracks = [];
    let currentIndex = -1;
    let isPlaying = false;

    const audio = document.getElementById('audioEngine');
    const trackGrid = document.getElementById('trackGrid');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const currTitle = document.getElementById('currTitle');
    const currArtist = document.getElementById('currArtist');
    const currImg = document.getElementById('currImg');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const uploadPanel = document.getElementById('uploadPanel');
    const uploadStatus = document.getElementById('uploadStatus');

    // Load songs from Firebase Storage
    async function loadFirebaseTracks() {
      trackGrid.innerHTML = '<div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Fetching files from Firebase Storage...</div>';
      
      try {
        const listRef = ref(storage, 'songs/');
        const res = await listAll(listRef);

        if (res.items.length === 0) {
          trackGrid.innerHTML = '<div class="state-msg">Your Firebase storage is empty!<br>Click "Upload Track" in the sidebar to add your first MP3 file.</div>';
          return;
        }

        cloudTracks = [];
        for (const itemRef of res.items) {
          const url = await getDownloadURL(itemRef);
          const rawName = itemRef.name.replace(/\.[^/.]+$/, "");
          const parts = rawName.split(' - ');
          
          cloudTracks.push({
            title: parts[1] || parts[0],
            artist: parts[1] ? parts[0] : 'Cloud Upload',
            cover: 'https://via.placeholder.com/300/181818/ffffff?text=Firebase+Audio',
            audio: url
          });
        }

        renderGrid();
      } catch (err) {
        console.error(err);
        trackGrid.innerHTML = '<div class="state-msg">Error loading from Firebase. Ensure Storage Rules are set to Public read/write.</div>';
      }
    }

    // Upload MP3 to Firebase Storage
    document.getElementById('startUploadBtn').onclick = async () => {
      const fileInput = document.getElementById('mp3FileInput');
      const titleInput = document.getElementById('songTitleInput').value.trim();
      const artistInput = document.getElementById('songArtistInput').value.trim();

      if (!fileInput.files[0]) {
        alert('Please select an MP3 file first!');
        return;
      }

      const file = fileInput.files[0];
      const filename = `${artistInput || 'Unknown'} - ${titleInput || file.name}`;
      const songRef = ref(storage, `songs/${filename}`);

      uploadStatus.textContent = 'Uploading to Firebase...';

      try {
        await uploadBytes(songRef, file);
        uploadStatus.textContent = 'Upload complete!';
        uploadPanel.style.display = 'none';
        loadFirebaseTracks();
      } catch (err) {
        console.error(err);
        uploadStatus.textContent = 'Upload failed. Check Firebase Storage rules.';
      }
    };

    function renderGrid() {
      trackGrid.innerHTML = '';
      cloudTracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${track.cover}" />
            <div class="play-btn-overlay"><i class="fa-solid fa-play"></i></div>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;
        card.onclick = () => playTrack(index);
        trackGrid.appendChild(card);
      });
    }

    function playTrack(index) {
      currentIndex = index;
      const track = cloudTracks[currentIndex];
      audio.src = track.audio;
      audio.play();
      isPlaying = true;
      playIcon.className = "fa-solid fa-pause";
      currTitle.textContent = track.title;
      currArtist.textContent = track.artist;
      currImg.src = track.cover;
    }

    playBtn.onclick = () => {
      if (!audio.src && cloudTracks.length > 0) { playTrack(0); return; }
      if (isPlaying) {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
      } else {
        audio.play();
        playIcon.className = "fa-solid fa-pause";
      }
      isPlaying = !isPlaying;
    };

    document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) playTrack(currentIndex - 1); };
    document.getElementById('nextBtn').onclick = () => { if (currentIndex < cloudTracks.length - 1) playTrack(currentIndex + 1); };

    audio.ontimeupdate = () => {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('duration').textContent = formatTime(audio.duration);
      }
    };

    audio.onended = () => { if (currentIndex < cloudTracks.length - 1) playTrack(currentIndex + 1); };

    progressBar.onclick = (e) => {
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / progressBar.offsetWidth) * audio.duration;
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('toggleUploadBtn').onclick = () => {
      uploadPanel.style.display = uploadPanel.style.display === 'none' ? 'flex' : 'none';
    };

    // Load initial songs from cloud
    loadFirebaseTracks();
  </script>
</body>
</html>
