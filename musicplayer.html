<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<title>OctoFlow</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
/* ===== Tokens ===== */
:root{--bg:#121212;--surface:#181818;--hi:#282828;--accent:#1ed760;--text:#fff;--sub:#b3b3b3;--line:rgba(255,255,255,.08);
--glass:rgba(24,24,24,.72);--ease:cubic-bezier(.2,.8,.2,1);--app-h:100dvh;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:var(--app-h);background:var(--bg);color:var(--text);overflow:hidden}
button{background:none;border:0;color:inherit;cursor:pointer}
.ic{color:var(--sub);width:40px;height:40px;border-radius:50%;font-size:16px;transition:color .2s,transform .2s}
.ic:hover{color:var(--text);transform:scale(1.08)}.ic.on{color:var(--accent)}
/* animated blurred artwork backdrop */
#bg{position:fixed;inset:-40px;z-index:0;background:#222 center/cover;filter:blur(70px) saturate(1.4) brightness(.45);transition:opacity .6s;transform:translateZ(0)}
.app{position:relative;z-index:1;height:var(--app-h);display:grid;grid-template-columns:250px 1fr auto;grid-template-rows:1fr 92px;gap:8px;padding:8px}
.card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:12px;border:1px solid var(--line)}
/* ===== Sidebar ===== */
.side{padding:20px 12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.brand{font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center;padding:0 8px}.brand i{color:var(--accent)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;white-space:nowrap}
.nav:hover,.nav.active{color:var(--text);background:var(--hi)}
.pl-list{display:flex;flex-direction:column;gap:2px}
.pl-list h4{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;margin:6px 12px}
.pl img{width:28px;height:28px;border-radius:4px;object-fit:cover}.pl span{flex:1;overflow:hidden;text-overflow:ellipsis}.pl .del{opacity:0;font-size:12px}.pl:hover .del{opacity:1}
/* ===== Main ===== */
.main{overflow-y:auto;padding:20px 24px calc(24px + var(--safe));scroll-behavior:smooth}
.top{display:flex;gap:12px;margin-bottom:20px}
.search{position:relative;flex:1;max-width:360px}.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search input{width:100%;height:44px;border-radius:22px;border:1px solid transparent;background:var(--hi);color:var(--text);padding:0 16px 0 40px;font-size:15px;outline:0;transition:.2s}
.search input:focus{border-color:var(--text)}
.hero{display:flex;align-items:flex-end;gap:20px;margin-bottom:24px;padding:20px;border-radius:12px;background:linear-gradient(120deg,#1db95433,#5038a033,#1db95433);background-size:200% 200%;animation:grad 12s ease infinite}
@keyframes grad{50%{background-position:100% 50%}}
.hero img{width:120px;height:120px;border-radius:10px;object-fit:cover;box-shadow:0 8px 30px #0008;background:var(--hi)}
.hero h1{font-size:clamp(24px,4vw,44px);font-weight:900;letter-spacing:-1px}.hero p{color:var(--sub);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.tc{background:var(--surface);padding:12px;border-radius:12px;cursor:pointer;position:relative;transition:background .25s,transform .25s var(--ease),box-shadow .25s;content-visibility:auto;contain-intrinsic-size:240px}
.tc:hover{background:var(--hi);transform:translateY(-4px);box-shadow:0 12px 28px #0008}
.tc.cur .t{color:var(--accent)}
.art{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--hi);margin-bottom:10px}
.art img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}.art img.ld{opacity:1}
.pb{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.25s var(--ease);box-shadow:0 8px 16px #0006}
.tc:hover .pb{opacity:1;transform:none}
.acts{position:absolute;top:18px;left:18px;display:flex;gap:6px;opacity:0;transition:.2s;z-index:2}.tc:hover .acts{opacity:1}
.acts button{width:32px;height:32px;border-radius:50%;background:#000b;font-size:12px}.acts button:hover{background:var(--accent);color:#000}
.t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
/* skeleton loaders while metadata loads */
.sk .t,.sk .a{background:linear-gradient(90deg,var(--hi) 25%,#3a3a3a 50%,var(--hi) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite;color:transparent;border-radius:4px;width:80%}.sk .a{width:50%}
.sk .art{animation:sh 1.2s linear infinite;background:linear-gradient(90deg,var(--hi) 25%,#3a3a3a 50%,var(--hi) 75%) 0 0/200% 100%}
@keyframes sh{to{background-position:-200% 0}}
.msg{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0}
/* ===== Side panel (queue / lyrics): sidebar on desktop, slide-up sheet on mobile ===== */
.panel{width:0;overflow:hidden;display:flex;flex-direction:column;transition:width .35s var(--ease)}
.panel.open{width:340px}
.ph{display:flex;align-items:center;gap:6px;padding:12px 12px 8px;min-width:340px}
.tab{padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px;color:var(--sub)}.tab.on{background:var(--hi);color:var(--text)}
.ph .sp{flex:1}
.pbody{flex:1;overflow-y:auto;min-width:340px;padding:4px 12px 24px;display:none}.pbody.on{display:block}
.qh{font-size:13px;font-weight:700;color:var(--sub);margin:12px 4px 6px;display:flex;justify-content:space-between}
.qi{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;transition:background .2s;user-select:none}
.qi:hover{background:var(--hi)}.qi.cur .t{color:var(--accent)}.qi.dragging{background:var(--hi);opacity:.7;box-shadow:0 6px 18px #000a}
.qi img{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--hi)}.qi .m{flex:1;min-width:0;cursor:pointer}
.qi button{width:36px;height:36px;color:var(--sub)}.qh-handle{touch-action:none;cursor:grab}
.ly{padding:16px 4px;display:flex;flex-direction:column;gap:14px;font-size:20px;font-weight:800;line-height:1.3}
.ly p{color:#ffffff55;transition:color .3s,transform .3s;transform-origin:left;cursor:pointer}.ly p.now{color:var(--text);transform:scale(1.04)}
.ly.plain p{color:var(--sub);font-size:15px;font-weight:500;cursor:default}
.state{color:var(--sub);text-align:center;padding:50px 10px;font-size:14px}
/* ===== Player bar (desktop) ===== */
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 16px}
.np{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.np img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--hi)}
.ctr{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;align-items:center;gap:10px}
.play{width:44px;height:44px;border-radius:50%;background:var(--text);color:#000;font-size:16px;transition:transform .2s}.play:hover{transform:scale(1.08)}
.seekrow{display:flex;gap:10px;align-items:center;width:100%;max-width:560px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.seekrow span{width:40px}.seekrow span:last-child{text-align:left}.seekrow span:first-child{text-align:right}
/* seek + volume: large invisible hit area, slim visible track */
.seek{position:relative;flex:1;height:24px;cursor:pointer;touch-action:none;display:flex;align-items:center}
.seek::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#ffffff40}
.fill{position:absolute;left:0;height:4px;border-radius:2px;background:var(--text);width:0;pointer-events:none}
.seek:hover .fill{background:var(--accent)}
.knob{position:absolute;left:0;width:12px;height:12px;border-radius:50%;background:#fff;margin-left:-6px;opacity:0;transition:opacity .2s;pointer-events:none}.seek:hover .knob,.seek.drag .knob{opacity:1}
.right{display:flex;justify-content:flex-end;align-items:center;gap:2px}.vol{width:100px;flex:none}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px}.eq i{width:3px;background:var(--accent);height:100%;animation:eq .8s ease infinite alternate;transform-origin:bottom}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{transform:scaleY(.2)}}.paused .eq i{animation-play-state:paused}
/* ===== Full Now Playing view ===== */
.full{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;background:#121212cc;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transform:translateY(100%);transition:transform .45s var(--ease);padding:12px 24px calc(28px + var(--safe));height:var(--app-h)}
.full.open{transform:none}
.full .head{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--sub)}
.big{width:min(86vw,44vh,440px);aspect-ratio:1;margin:auto 0;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px #000a;background:var(--hi);transition:transform .6s var(--ease)}
.big img{width:100%;height:100%;object-fit:cover}.paused .big{transform:scale(.88)}
.fmeta{width:min(100%,440px);margin-bottom:6px}.fmeta .t{font-size:22px}.fmeta .a{font-size:15px}
.full .seekrow{max-width:440px}.full .btns{gap:18px;margin:6px 0}.full .play{width:64px;height:64px;font-size:24px}
.sec{display:flex;gap:6px;align-items:center;margin-top:4px}
.mini{display:none}
.fade{animation:fd .5s var(--ease)}@keyframes fd{from{opacity:0;transform:scale(.96)}}
/* spinning disc effect for artwork while playing (bar thumbnail) */
.spin img{animation:rot 14s linear infinite;border-radius:50%}.paused .spin img{animation-play-state:paused}@keyframes rot{to{transform:rotate(360deg)}}
/* ===== Modals ===== */
.ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);padding:24px;border-radius:16px;width:340px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.modal input,.modal select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:#fff;font-size:15px}
.mb{display:flex;gap:8px;justify-content:flex-end}.mb button{padding:10px 20px;border-radius:20px;font-weight:700}.ok{background:var(--accent);color:#000}.no{background:var(--hi)}
.newpl{background:var(--accent);color:#000;border-radius:20px;padding:10px;font-weight:800;font-size:13px;display:flex;gap:8px;justify-content:center;align-items:center}
/* ===== OctoFlow additions ===== */
.sh{grid-column:1/-1;font-size:22px;font-weight:800;margin:14px 0 -2px;letter-spacing:-.5px}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.tools button{background:var(--hi);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;transition:.2s}.tools button:hover{background:var(--accent);color:#000}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:var(--surface);border-radius:12px;padding:18px}.stat b{display:block;font-size:30px}.stat span{color:var(--sub);font-size:13px}
.lst{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}.br{display:grid;grid-template-columns:minmax(80px,200px) 1fr 40px;gap:10px;align-items:center;font-size:13px}.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br i{height:10px;border-radius:5px;background:var(--accent);transition:width .6s var(--ease)}.br em{color:var(--sub);font-style:normal}
.keys{grid-column:1/-1;color:var(--sub);font-size:13px;line-height:2}.keys kbd{background:var(--hi);color:var(--text);padding:2px 7px;border-radius:5px;margin-right:4px}
.full canvas{position:absolute;left:0;bottom:0;width:100%;height:30%;opacity:.45;pointer-events:none;z-index:-1}
.modal small{color:var(--sub)}
/* ===== Mobile (<768px) ===== */
@media(max-width:767px){
 .app{display:flex;flex-direction:column;padding:0;gap:0}
 .side{flex-direction:row;align-items:center;padding:10px 12px;border-radius:0;overflow-x:auto;gap:8px;flex:none}.brand span,.side hr{display:none}
 .nav{padding:10px 14px;background:var(--hi);border-radius:20px;min-height:44px}.nav.active{background:var(--text);color:#000}
 .pl-list{flex-direction:row}.pl-list h4{display:none}.pl img{display:none}.pl .del{opacity:1;padding:8px}
 .newpl{white-space:nowrap;padding:0 16px;min-height:44px;flex:none}
 .main{flex:1;border-radius:0;padding:12px 14px calc(150px + var(--safe))}
 .hero{padding:14px}.hero img{width:80px;height:80px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .search{max-width:none}.pb,.acts{opacity:1;transform:none}.acts{top:16px;left:16px}.acts button{width:36px;height:36px}
 .bar{display:none}
 /* floating mini player: lifted off the bottom edge so browser toolbars never cover it */
 .mini{display:flex;position:fixed;left:8px;right:8px;bottom:calc(14px + var(--safe));z-index:10;align-items:center;gap:10px;padding:8px 8px 12px;overflow:hidden}
 .mini img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--hi)}.mini .m{flex:1;min-width:0}.mini .ic{width:48px;height:48px;font-size:20px}
 .mini .mp{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
 .panel,.panel.open{position:fixed;left:0;right:0;bottom:0;width:100%;height:72%;z-index:40;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .4s var(--ease);padding-bottom:var(--safe);background:#181818f2}
 .panel.open{transform:none}.ph,.pbody{min-width:0}.ph::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#ffffff40}
 .ic{width:48px;height:48px}.seek{height:36px}.knob{opacity:1;width:16px;height:16px;margin-left:-8px}.seek::before,.fill{height:6px}
 .big{width:min(78vw,40vh)}.full .vol-wrap{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="bg"></div>

<!-- Modals (existing playlist features) -->
<div class="ov" id="addMod"><div class="modal"><h3>Add to playlist</h3><select id="addSel"></select><div class="mb"><button class="no" data-close>Cancel</button><button class="ok" id="addOk">Add</button></div></div></div>
<div class="ov" id="newMod"><div class="modal"><h3>New playlist</h3><input id="plName" type="text" placeholder="Playlist name" /><label style="font-size:12px;color:var(--sub)">Cover photo (optional)</label><input id="plImg" type="file" accept="image/*" /><div class="mb"><button class="no" data-close>Cancel</button><button class="ok" id="newOk">Create</button></div></div></div>

<div class="app" id="app">
  <aside class="side card">
    <div class="brand"><i class="fa-solid fa-bolt"></i><span>OctoFlow</span></div>
    <div class="nav active" id="home"><i class="fa-solid fa-house"></i> Home</div><div class="nav" id="favNav"><i class="fa-solid fa-heart"></i> Favorites</div><div class="nav" id="statNav"><i class="fa-solid fa-chart-simple"></i> Stats</div>
    <button class="newpl" id="newBtn"><i class="fa-solid fa-plus"></i> New Playlist</button>
    <div class="nav" id="reqNav"><i class="fa-solid fa-hand-holding-heart"></i> Request a song</div><div class="nav" id="impBtn"><i class="fa-solid fa-file-import"></i> Import playlist</div><input type="file" id="impFile" accept=".json" hidden /><div class="pl-list" id="pls"><h4>Playlists</h4></div>
  </aside>

  <main class="main card" id="main">
    <div class="top"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" placeholder="What do you want to play?" /></div></div>
    <div class="hero"><img id="heroImg" alt="" /><div><h1 id="heroT">Library</h1><p id="heroS">Loading…</p><div class="tools" id="tools"></div></div></div>
    <div class="grid" id="grid"></div>
  </main>

  <!-- Queue / Lyrics panel -->
  <aside class="panel card" id="panel">
    <div class="ph"><button class="tab on" data-tab="queue">Queue</button><button class="tab" data-tab="lyrics">Lyrics</button><span class="sp"></span><button class="ic" id="panelClose" title="Collapse"><i class="fa-solid fa-chevron-down"></i></button></div>
    <div class="pbody on" id="queueBody"></div>
    <div class="pbody" id="lyricsBody"></div>
  </aside>

  <!-- Desktop player bar -->
  <footer class="bar card" id="bar">
    <div class="np" data-open-full><span class="spin"><img data-cover alt="" /></span><div style="min-width:0"><div class="t" data-title>Nothing playing</div><div class="a" data-artist>Pick a track</div></div></div>
    <div class="ctr"><div class="btns" data-controls></div><div class="seekrow"><span data-cur>0:00</span><div class="seek" data-seek><div class="fill"></div><div class="knob"></div></div><span data-rem>-0:00</span></div></div>
    <div class="right"><button class="ic" data-act="fav" title="Favorite"><i class="fa-regular fa-heart"></i></button><button class="ic" data-act="lyrics" title="Lyrics"><i class="fa-solid fa-microphone-lines"></i></button><button class="ic" data-act="queue" title="Queue"><i class="fa-solid fa-list"></i></button><i class="fa-solid fa-volume-high" data-vicon style="color:var(--sub);margin:0 6px"></i><div class="seek vol" data-vol><div class="fill"></div><div class="knob"></div></div></div>
  </footer>
</div>

<!-- Mobile mini player -->
<div class="mini card" id="mini"><div class="np" data-open-full style="flex:1"><img data-cover alt="" /><div class="m"><div class="t" data-title>Nothing playing</div><div class="a" data-artist>Pick a track</div></div></div><button class="ic" data-act="play"><i class="fa-solid fa-play" data-pi></i></button><div class="mp" id="miniProg"></div></div>

<!-- Full Now Playing view -->
<section class="full" id="full">
  <div class="head"><button class="ic" id="fullClose"><i class="fa-solid fa-chevron-down"></i></button><span data-status>Ready</span><span style="width:40px"></span></div>
  <canvas id="viz" width="640" height="200"></canvas><div class="big"><img data-cover alt="" /></div>
  <div class="fmeta"><div class="t" data-title>Nothing playing</div><div class="a" data-artist></div></div>
  <div class="seekrow" style="width:100%"><span data-cur>0:00</span><div class="seek" data-seek><div class="fill"></div><div class="knob"></div></div><span data-rem>-0:00</span></div>
  <div class="btns" data-controls></div>
  <div class="sec"><button class="ic" data-act="fav"><i class="fa-regular fa-heart"></i></button><button class="ic" data-act="like" title="Like"><i class="fa-regular fa-thumbs-up"></i></button><button class="ic" data-act="dislike" title="Dislike"><i class="fa-regular fa-thumbs-down"></i></button><button class="ic" data-act="comments" title="Comments"><i class="fa-regular fa-comment"></i></button><button class="ic" data-act="lyrics"><i class="fa-solid fa-microphone-lines"></i></button><button class="ic" data-act="queue"><i class="fa-solid fa-list"></i></button><div class="vol-wrap" style="display:flex;align-items:center;gap:8px"><i class="fa-solid fa-volume-high" style="color:var(--sub)"></i><div class="seek vol" data-vol style="width:110px"><div class="fill"></div><div class="knob"></div></div></div></div>
</section>
<div class="ov" id="gMod"><div class="modal" id="gBody"></div></div>
<audio id="audio" preload="metadata"></audio>

<script>
/* ============ CONFIG ============ */
const REPO_USER='CalcSolver',REPO_NAME='OctoArcade',BRANCH='main',FOLDER='Songs/MP3s';
const PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#282828'/><path d='M62 24v38a10 10 0 1 1-6-9V32l-22 5v32a10 10 0 1 1-6-9V30z' fill='#555'/></svg>");
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ============ STATE ============ */
let library=[],playlists=store.get('octo_playlists',{Favorites:{tracks:[],image:''}}),activePl=null,shown=[];
let queue=[],qi=-1,ctxOrder=[],shuffle=false,repeat='off',uid=0,addTarget=null,lastCur=null;
const byUrl=new Map(),byUid=new Map(),byFile=new Map(),audio=$('#audio');
Object.keys(playlists).forEach(k=>{if(Array.isArray(playlists[k]))playlists[k]={tracks:playlists[k],image:''}}); // legacy format
/* Local stats store: plays, likes, favorites, recents, comments, requests (no backend, so per-device) */
let S=store.get('octo_stats',{});S={plays:{},likes:{},fav:{},recent:[],comments:{},reqs:[],sec:0,seen:{},...S};
const saveS=()=>store.set('octo_stats',S),cur=()=>queue[qi];let view='home',lastT=0;

/* ============ METADATA (iTunes Search API, cached, throttled) ============ */
const META_KEY='octo_meta_v1',DAY=864e5;let meta=store.get(META_KEY,{}),saveT,mq=[],mBusy=false,backoff=0;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function fromFilename(name){ // fallback title/artist from "Artist - Title.mp3"
  const c=decodeURIComponent(name).replace(/\.[^/.]+$/,'').replace(/_/g,' ').trim(),p=c.split(' - ');
  return p.length>1?{artist:p[0].trim(),title:p.slice(1).join(' - ').trim()}:{artist:'Unknown Artist',title:c};
}
function makeTrack(o){const t={uid:++uid,state:'idle',cover:PLACEHOLDER,album:'',...o};byUrl.set(t.audio,t);byFile.set(t.file,t);byUid.set(t.uid,t);return t}
function applyMeta(t,m){if(m&&m.found){Object.assign(t,{title:m.title,artist:m.artist,album:m.album,cover:m.cover});t.state='done'}else t.state='missing';refreshViews(t)}
function ensureMeta(t,priority){ // queue a lookup; cache hit resolves instantly
  if(t.state==='done'||t.state==='missing'||t.queued)return;
  const c=meta[t.file];if(c&&Date.now()-c.ts<(c.found?90:7)*DAY){applyMeta(t,c);return}
  t.queued=1;priority?mq.unshift(t):mq.push(t);pump();
}
async function pump(){
  if(mBusy||!mq.length)return;mBusy=true;
  const t=mq.shift();
  try{const m=await itunes(t);meta[t.file]={...m,ts:Date.now()};clearTimeout(saveT);saveT=setTimeout(()=>store.set(META_KEY,meta),800);applyMeta(t,m)}
  catch(e){t.queued=0;mq.push(t);backoff=30000} // rate-limited: retry later
  setTimeout(()=>{mBusy=false;backoff=0;pump()},backoff||350);
}
async function itunes(t){
  const fn=fromFilename(t.file),term=(fn.artist==='Unknown Artist'?'':fn.artist+' ')+fn.title,url=`https://itunes.apple.com/search?media=music&entity=song&limit=6&term=${encodeURIComponent(term)}`;
  const res=await fetch(url);if(!res.ok)throw new Error(res.status);
  const {results=[]}=await res.json(),f=norm(fn.artist+fn.title);let best=null,bs=0;
  for(const r of results){ // score: title/artist contained in filename
    const tn=norm(r.trackName||''),an=norm(r.artistName||'');let s=0;
    if(tn.length>2&&f.includes(tn))s+=2;if(an.length>2&&f.includes(an))s+=1;
    if(s>bs){bs=s;best=r}
  }
  if(!best||bs<2)return{found:false};
  return{found:true,title:best.trackName,artist:best.artistName,album:best.collectionName||'',cover:(best.artworkUrl100||'').replace('100x100bb','600x600bb')||PLACEHOLDER};
}

/* ============ LIBRARY (GitHub repo auto-discovery) ============ */
async function loadLibrary(){
  $('#grid').innerHTML='<div class="msg"><i class="fa-solid fa-spinner fa-spin"></i> Syncing library…</div>';
  let files=null;const c=store.get('octo_files',null);
  if(c&&Date.now()-c.ts<6e5)files=c.files; // 10 min cache avoids GitHub's 60 req/hr limit
  try{
    if(!files){const r=await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${FOLDER}`);if(!r.ok)throw 0;
      files=(await r.json()).filter(f=>f.name.toLowerCase().endsWith('.mp3')).map(f=>f.name);store.set('octo_files',{ts:Date.now(),files})}
  }catch{if(c)files=c.files}
  if(!files){$('#grid').innerHTML='<div class="msg">Failed to load library.</div>';return}
  library=files.map(f=>{const n=fromFilename(f),url=`https://cdn.jsdelivr.net/gh/${REPO_USER}/${REPO_NAME}@${BRANCH}/${FOLDER}/${encodeURIComponent(f)}`;return makeTrack({file:f,audio:url,...n})});
  library.forEach(t=>S.seen[t.file]=S.seen[t.file]||Date.now());saveS();showLibrary();checkShare();
}

/* ============ PLAYBACK / QUEUE MODEL ============ */
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function playFrom(t,list){ // start playback with `list` as context
  ctxOrder=[...list];queue=shuffle?[t,...shuf(list.filter(x=>x!==t))]:[...list];qi=queue.indexOf(t);playAt(qi);
}
function rebuildUpcoming(){ // after shuffle toggle
  const cur=queue[qi];if(!cur)return;const hist=queue.slice(0,qi+1),set=new Set(hist);
  let rest=ctxOrder.filter(x=>!set.has(x));if(!shuffle){const i=ctxOrder.indexOf(cur);rest=i>=0?ctxOrder.slice(i+1).filter(x=>!set.has(x)):rest}else rest=shuf(rest);
  queue=[...hist,...rest];renderQueue();
}
function enqueue(t){if(qi<0){queue=[t];ctxOrder=[t];qi=0;playAt(0);return}queue.push(t);renderQueue();toast()}
function toast(){const b=$('[data-act=queue]');b.classList.add('on');setTimeout(()=>b.classList.toggle('on',$('#panel').classList.contains('open')),600)}
function playAt(i){
  qi=i;const t=queue[i];if(!t)return;lastCur=t;
  audio.src=t.audio;audio.play().catch(()=>{});
  initViz();t.counted=0;S.recent=[t.file,...S.recent.filter(f=>f!==t.file)].slice(0,30);saveS();ensureMeta(t,true);paintNow(t,true);paintActs();renderQueue();$$('.tc').forEach(d=>d.classList.toggle('cur',byUid.get(+d.dataset.u)===t));loadLyrics(t);
  if(queue[i+1])ensureMeta(queue[i+1]);
  if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:[{src:t.cover}]});
}
function next(auto){
  if(auto&&repeat==='one'){audio.currentTime=0;audio.play();return}
  if(qi<queue.length-1)return playAt(qi+1);
  if(repeat==='all'&&ctxOrder.length){queue=shuffle?shuf(ctxOrder):[...ctxOrder];return playAt(0)}
  audio.pause();
}
function prev(){if(audio.currentTime>3||qi<=0)audio.currentTime=0;else playAt(qi-1)}
audio.onended=()=>next(true);
audio.onplay=audio.onpause=()=>syncPlayUI();
function toggle(){if(!audio.src){if(shown.length)playFrom(shown[0],shown);return}audio.paused?audio.play():audio.pause()}

/* ============ SEEK + VOLUME (pointer events: mouse + touch drag) ============ */
function slider(el,onVal){
  const set=e=>{const r=el.getBoundingClientRect();onVal(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)))};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);el.classList.add('drag');el._d=1;set(e)});
  el.addEventListener('pointermove',e=>el._d&&set(e));
  ['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>{el._d=0;el.classList.remove('drag')}));
}
const setFill=(el,p)=>{$('.fill',el).style.width=p*100+'%';$('.knob',el).style.left=p*100+'%'};
$$('[data-seek]').forEach(s=>slider(s,p=>{if(audio.duration){audio.currentTime=p*audio.duration;setFill(s,p)}}));
$$('[data-vol]').forEach(v=>slider(v,p=>{audio.volume=p;audio.muted=false;store.set('octo_vol',p);paintVol()}));
function paintVol(){const p=audio.muted?0:audio.volume;$$('[data-vol]').forEach(v=>setFill(v,p));$$('[data-vicon]').forEach(i=>i.className='fa-solid '+(p===0?'fa-volume-xmark':p<.5?'fa-volume-low':'fa-volume-high'))}
audio.volume=store.get('octo_vol',.8);paintVol();
const fmt=s=>isFinite(s)?`${s/60|0}:${String(s%60|0).padStart(2,'0')}`:'0:00';
audio.ontimeupdate=()=>{
  const d=audio.duration,c=audio.currentTime;if(!d)return;
  const tk=cur();if(tk){S.sec+=Math.min(1,Math.max(0,c-lastT)); // listening time + play count (30s or 80%)
    if(!tk.counted&&(c>=30||c>d*.8)){tk.counted=1;S.plays[tk.file]=(S.plays[tk.file]||0)+1;saveS()}}lastT=c;
  $$('[data-seek]').forEach(s=>{if(!s._d)setFill(s,c/d)});$$('[data-cur]').forEach(e=>e.textContent=fmt(c));$$('[data-rem]').forEach(e=>e.textContent='-'+fmt(d-c));
  $('#miniProg').style.width=c/d*100+'%';syncLyrics(c);
};

/* ============ LYRICS (LRCLIB: synced when available) ============ */
const lyCache=new Map();let lines=[],lyIdx=-1,lyTok=0;
const parseLrc=s=>s.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);return m?{t:+m[1]*60+ +m[2],x:m[3].trim()}:null}).filter(l=>l&&l.x);
async function loadLyrics(t){
  const tok=++lyTok,b=$('#lyricsBody');lines=[];lyIdx=-1;
  b.innerHTML='<div class="state"><i class="fa-solid fa-spinner fa-spin"></i> Loading lyrics…</div>';
  const key=t.artist+'|'+t.title;
  try{
    let d=lyCache.get(key);
    if(!d){
      const qs=new URLSearchParams({track_name:t.title,artist_name:t.artist==='Unknown Artist'?'':t.artist});
      const r=await fetch('https://lrclib.net/api/search?'+qs);if(!r.ok)throw 0;
      const arr=await r.json();d=arr.find(x=>x.syncedLyrics)||arr.find(x=>x.plainLyrics)||null;lyCache.set(key,d);
    }
    if(tok!==lyTok)return;
    if(!d)return b.innerHTML='<div class="state"><i class="fa-regular fa-face-frown"></i><br>No lyrics found for this song.</div>';
    if(d.syncedLyrics){lines=parseLrc(d.syncedLyrics);b.innerHTML='<div class="ly">'+lines.map((l,i)=>`<p data-i="${i}">${esc(l.x)}</p>`).join('')+'</div>'}
    else b.innerHTML='<div class="ly plain">'+d.plainLyrics.split('\n').map(l=>`<p>${esc(l)||'&nbsp;'}</p>`).join('')+'</div>';
  }catch{if(tok===lyTok)b.innerHTML='<div class="state">Couldn’t load lyrics. Check your connection.</div>'}
}
$('#lyricsBody').addEventListener('click',e=>{const p=e.target.closest('p[data-i]');if(p)audio.currentTime=lines[+p.dataset.i].t});
function syncLyrics(c){ // highlight + auto-scroll current line
  if(!lines.length)return;let i=-1;for(let k=0;k<lines.length&&lines[k].t<=c;k++)i=k;
  if(i===lyIdx)return;const b=$('#lyricsBody');$(`p[data-i="${lyIdx}"]`,b)?.classList.remove('now');lyIdx=i;
  const el=$(`p[data-i="${i}"]`,b);if(el){el.classList.add('now');if($('#panel').classList.contains('open'))b.scrollTo({top:el.offsetTop-b.clientHeight/3,behavior:'smooth'})}
}

/* ============ MOBILE VIEWPORT FIX + MEDIA KEYS ============ */
const vh=()=>document.documentElement.style.setProperty('--app-h',(window.visualViewport?.height||innerHeight)+'px');
vh();addEventListener('resize',vh);window.visualViewport?.addEventListener('resize',vh);
if('mediaSession'in navigator){[['play',()=>audio.play()],['pause',()=>audio.pause()],['previoustrack',prev],['nexttrack',()=>next()]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}})}
addEventListener('pagehide',saveS);
const vol=d=>{audio.volume=Math.min(1,Math.max(0,audio.volume+d));store.set('octo_vol',audio.volume);paintVol()};
const KEYS={s:'shuffle',r:'repeat',l:'like',d:'dislike',f:'fav',q:'queue',y:'lyrics'};
addEventListener('keydown',e=>{ // keyboard shortcuts
  if(e.target.matches('input,select,textarea')||e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(k==='arrowright')e.shiftKey?next():audio.currentTime+=5;else if(k==='arrowleft')e.shiftKey?prev():audio.currentTime-=5;
  else if(k==='arrowup'){e.preventDefault();vol(.05)}else if(k==='arrowdown'){e.preventDefault();vol(-.05)}
  else if(k==='m'){audio.muted=!audio.muted;paintVol()}else if(k==='v')$('#full').classList.toggle('open');
  else if(k==='/'){e.preventDefault();$('#q').focus()}else if(KEYS[k])$(`[data-act=${KEYS[k]}]`).click();
});
/* ============ FAVORITES / LIKES ============ */
function toggleFav(t){if(!t)return;S.fav[t.file]=S.fav[t.file]?0:1;saveS();paintActs()}
function rate(t,v){if(!t)return;S.likes[t.file]=S.likes[t.file]===v?0:v;saveS();paintActs()}
function paintActs(){
  const t=cur(),f=t&&S.fav[t.file],l=t&&S.likes[t.file];
  $$('[data-act=fav]').forEach(b=>{b.classList.toggle('on',!!f);b.innerHTML=`<i class="fa-${f?'solid':'regular'} fa-heart"></i>`});
  $$('[data-act=like]').forEach(b=>{b.classList.toggle('on',l===1);b.innerHTML=`<i class="fa-${l===1?'solid':'regular'} fa-thumbs-up"></i>`});
  $$('[data-act=dislike]').forEach(b=>{b.classList.toggle('on',l===-1);b.innerHTML=`<i class="fa-${l===-1?'solid':'regular'} fa-thumbs-down"></i>`});
}
/* ============ MODALS: comments, requests, share ============ */
function modal(h){$('#gBody').innerHTML=h;$('#gMod').style.display='flex'}
$('#gMod').onclick=e=>{if(e.target.id==='gMod'||e.target.closest('[data-x]'))$('#gMod').style.display='none'};
function commentsModal(t){
  if(!t)return;const c=S.comments[t.file]||[];
  modal(`<h3>Comments · ${esc(t.title)}</h3><div style="max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:10px">${c.map(x=>`<div><small>${new Date(x.ts).toLocaleDateString()}</small><div>${esc(x.x)}</div></div>`).join('')||'<div class="state">No comments yet.</div>'}</div><input id="cmI" maxlength="280" placeholder="Add a comment…"><small>Comments are saved on this device.</small><div class="mb"><button class="no" data-x>Close</button><button class="ok" id="cmB">Post</button></div>`);
  $('#cmB').onclick=()=>{const x=$('#cmI').value.trim();if(!x)return;(S.comments[t.file]=S.comments[t.file]||[]).push({x,ts:Date.now()});saveS();commentsModal(t)};
}
function requestModal(){
  modal(`<h3>Request a song</h3><input id="rqI" placeholder="Artist – Song title"><small>Saved on this device and opens a prefilled GitHub issue so the owner can see it.</small><div class="mb"><button class="no" data-x>Cancel</button><button class="ok" id="rqB">Send</button></div>`);
  $('#rqB').onclick=()=>{const x=$('#rqI').value.trim();if(!x)return;S.reqs.push({x,ts:Date.now()});saveS();open(`https://github.com/${REPO_USER}/${REPO_NAME}/issues/new?title=${encodeURIComponent('Song request: '+x)}`,'_blank');$('#gMod').style.display='none'};
}
/* ============ PLAYLIST IMPORT / EXPORT / SHARE / QR ============ */
const filesOf=n=>playlists[n].tracks.map(t=>byUrl.get(t.audio)?.file).filter(Boolean);
function tools(){$('#tools').innerHTML='<button data-t="share"><i class="fa-solid fa-share-nodes"></i> Share + QR</button><button data-t="export"><i class="fa-solid fa-file-export"></i> Export</button>'}
$('#tools').onclick=e=>{const b=e.target.closest('[data-t]');if(!b||!activePl)return;b.dataset.t==='share'?shareModal(activePl):exportPl(activePl)};
function exportPl(n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({octoflow:1,name:n,files:filesOf(n)})],{type:'application/json'}));a.download=n+'.octoflow.json';a.click();URL.revokeObjectURL(a.href)}
function importPl(name,files){
  const tr=files.map(f=>byFile.get(f)).filter(Boolean);if(!tr.length)return alert('None of those songs exist in this library.');
  let k=name||'Imported',i=2;const base=k;while(playlists[k])k=`${base} (${i++})`;
  playlists[k]={tracks:tr,image:''};savePls();openPl(k);
}
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());importPl(d.name,d.files||[])}catch{alert('Invalid playlist file.')}e.target.value=''};
const shareUrl=n=>location.href.split('#')[0]+'#pl='+btoa(unescape(encodeURIComponent(JSON.stringify({n,f:filesOf(n)}))));
function shareModal(n){
  const u=shareUrl(n);
  modal(`<h3>Share “${esc(n)}”</h3><input readonly id="shU" value="${esc(u)}"><div id="qr" style="display:grid;place-items:center;background:#fff;border-radius:12px;padding:12px;min-height:80px"></div><div class="mb"><button class="no" data-x>Close</button><button class="ok" id="cpy">Copy link</button></div>`);
  try{new QRCode($('#qr'),{text:u,width:200,height:200,correctLevel:QRCode.CorrectLevel.L})}catch{$('#qr').innerHTML='<small style="color:#000">Too many songs for a QR code. Use the link or Export.</small>'}
  $('#cpy').onclick=()=>{navigator.clipboard?.writeText(u);$('#cpy').textContent='Copied!'};
}
function checkShare(){ // open a shared link: #pl=...
  const m=location.hash.match(/^#pl=(.+)/);if(!m)return;
  try{const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));history.replaceState(null,'',location.pathname);if(confirm(`Import shared playlist "${d.n}" (${d.f.length} songs)?`))importPl(d.n,d.f)}catch{}
}
/* ============ STATISTICS DASHBOARD ============ */
function showStats(){
  setHero('Your stats','Listening activity on this device','');
  const P=t=>S.plays[t.file]||0,top=library.filter(P).sort((a,b)=>P(b)-P(a)).slice(0,5),tot=Object.values(S.plays).reduce((a,b)=>a+b,0),ar={};
  library.forEach(t=>{if(P(t))ar[t.artist]=(ar[t.artist]||0)+P(t)});const ta=Object.entries(ar).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const box=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`,row=(n,v,m)=>`<div class="br"><span>${esc(n)}</span><i style="width:${v/m*100}%"></i><em>${v}</em></div>`;
  $('#grid').innerHTML=`<div class="stats">${box(library.length,'Songs')}${box(tot,'Plays')}${box((S.sec/3600).toFixed(1)+'h','Listened')}${box(Object.values(S.fav).filter(Boolean).length,'Favorites')}</div>
  <h2 class="sh">Top songs</h2><div class="lst">${top.map(t=>row(t.title,P(t),P(top[0]))).join('')||'<div class="state">Play some songs to see stats.</div>'}</div>
  <h2 class="sh">Top artists</h2><div class="lst">${ta.map(a=>row(a[0],a[1],ta[0][1])).join('')||'<div class="state">Nothing yet.</div>'}</div>
  <h2 class="sh">Keyboard shortcuts</h2><div class="keys"><kbd>Space</kbd>play/pause <kbd>←</kbd><kbd>→</kbd>seek 5s <kbd>Shift+←/→</kbd>prev/next <kbd>↑</kbd><kbd>↓</kbd>volume <kbd>M</kbd>mute <kbd>S</kbd>shuffle <kbd>R</kbd>repeat <kbd>F</kbd>favorite <kbd>L</kbd>like <kbd>D</kbd>dislike <kbd>Q</kbd>queue <kbd>Y</kbd>lyrics <kbd>V</kbd>full view <kbd>/</kbd>search</div>`;
}
/* ============ VISUALIZER (Web Audio analyser) ============ */
let an,actx,vdata;const cv=$('#viz'),g2=cv.getContext('2d');
function initViz(){
  if(actx){actx.state==='suspended'&&actx.resume();return}
  try{actx=new(window.AudioContext||webkitAudioContext)();const src=actx.createMediaElementSource(audio);an=actx.createAnalyser();an.fftSize=128;src.connect(an);an.connect(actx.destination);vdata=new Uint8Array(an.frequencyBinCount)}catch{actx=null}
}
function draw(){
  requestAnimationFrame(draw);if(!an||audio.paused||!$('#full').classList.contains('open'))return; // only runs when visible
  an.getByteFrequencyData(vdata);g2.clearRect(0,0,640,200);const w=640/vdata.length;g2.fillStyle='#1ed760';
  vdata.forEach((v,i)=>{const h=v/255*190;g2.fillRect(i*w+2,200-h,w-4,h)});
}

/* ============ INIT ============ */
document.body.classList.add('paused');syncModes();renderPls();renderQueue();setHero('OctoFlow','Loading…','');audio.crossOrigin='anonymous';draw();loadLibrary();
</script>
</body>
