<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octo Music</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-base: #121212;
      --bg-surface: #181818;
      --bg-highlight: #282828;
      --primary: #1db954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --border-color: #282828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 90px);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #000000;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }

    .brand i {
      color: var(--primary);
      font-size: 24px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-main);
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border-color);
      margin: 4px 0;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-highlight);
    }

    .action-btn.primary-btn {
      background: var(--primary);
      color: #000;
      border: none;
    }

    .action-btn.primary-btn:hover {
      opacity: 0.9;
    }

    .user-playlists-section h4 {
      font-size: 12px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .playlist-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .playlist-item {
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s;
    }

    .playlist-item:hover, .playlist-item.active {
      color: var(--text-main);
    }

    /* Main Area */
    .main-content {
      flex: 1;
      background: linear-gradient(to bottom, #1e3a29 0%, var(--bg-base) 300px);
      overflow-y: auto;
      padding: 24px 32px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      position: relative;
      width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 50px;
      border: none;
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: rgba(29, 185, 84, 0.1);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .hero-banner {
      margin-bottom: 24px;
    }

    .hero-banner h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 32px 0 16px 0;
      color: var(--text-main);
    }

    /* Track Grid */
    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .track-card {
      background-color: var(--bg-surface);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      position: relative;
    }

    .track-card:hover {
      background-color: var(--bg-highlight);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #282828;
    }

    .card-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn-overlay {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 40px;
      height: 40px;
      background-color: var(--primary);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #000;
      font-size: 16px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    .track-card:hover .play-btn-overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .add-to-playlist-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
    }

    .add-to-playlist-btn:hover {
      transform: scale(1.1);
      background: var(--primary);
      color: #000;
    }

    .track-card:hover .add-to-playlist-btn {
      opacity: 1;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-artist {
      font-size: 12px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Player Bar */
    .player-bar {
      height: 90px;
      background-color: #000000;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .current-track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 30%;
    }

    .current-thumb {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      object-fit: cover;
      background: #282828;
    }

    .current-info .title {
      font-size: 14px;
      font-weight: 600;
    }

    .current-info .artist {
      font-size: 12px;
      color: var(--text-sub);
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 40%;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .control-btn:hover {
      color: var(--text-main);
    }

    .control-btn.play-pause {
      width: 36px;
      height: 36px;
      background-color: var(--text-main);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .control-btn.play-pause:hover {
      transform: scale(1.05);
      color: #000;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background-color: #4f4f4f;
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--text-main);
      border-radius: 2px;
      width: 0%;
    }

    .progress-bar:hover .progress-fill {
      background-color: var(--primary);
    }

    .volume-container {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      width: 30%;
      color: var(--text-sub);
    }

    .volume-bar {
      width: 90px;
      height: 4px;
      background-color: #4f4f4f;
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .volume-fill {
      height: 100%;
      background-color: var(--text-main);
      width: 80%;
      border-radius: 2px;
    }

    .state-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px 0;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-compact-disc"></i>
        <span>Octo Music</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item active" id="navHome"><i class="fa-solid fa-house"></i> Home</li>
        <li class="nav-item" id="navSearch"><i class="fa-solid fa-magnifying-glass"></i> Search</li>
      </ul>

      <div class="sidebar-divider"></div>

      <button class="action-btn primary-btn" id="createPlaylistBtn">
        <i class="fa-solid fa-plus"></i> Create Playlist
      </button>

      <button class="action-btn" id="importSpotifyBtn">
        <i class="fa-brands fa-spotify" style="color: var(--primary);"></i> Import Spotify
      </button>

      <div class="user-playlists-section">
        <h4>Your Playlists</h4>
        <ul class="playlist-list" id="playlistList">
          <!-- Playlists populate here -->
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search full-length tracks..." />
        </div>
        <span class="status-badge" id="apiStatus"><i class="fa-solid fa-server"></i> Full-Length Engine</span>
      </div>

      <div class="hero-banner">
        <h1 id="feedTitle">Top Tracks Today</h1>
        <p style="color: var(--text-sub);">Stream full-length ad-free music persisted in LocalStorage</p>
      </div>

      <!-- Main Track Grid -->
      <div class="track-grid" id="trackGrid">
        <div class="state-msg">Loading audio streams...</div>
      </div>

      <!-- Recommended Section -->
      <div id="recommendedSection" style="display: none;">
        <h2 class="section-title">Recommended For You</h2>
        <div class="track-grid" id="recommendedGrid"></div>
      </div>
    </main>
  </div>

  <!-- Player Bar -->
  <footer class="player-bar">
    <div class="current-track">
      <img id="currentThumb" class="current-thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' fill='%23282828'><rect width='56' height='56'/></svg>" />
      <div class="current-info">
        <div class="title" id="currentTitle">No Track Playing</div>
        <div class="artist" id="currentArtist">Select a song</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="control-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="control-btn play-pause" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
        <button class="control-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-container">
      <i class="fa-solid fa-volume-high"></i>
      <div class="volume-bar" id="volumeBar">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
    </div>
  </footer>

  <audio id="audioEngine"></audio>

  <script>
    const JAMENDO_CLIENT_ID = '568f2f67';

    // Local Storage & Playlist State
    let userPlaylists = JSON.parse(localStorage.getItem('octo_playlists') || '{"My Favorites": []}');
    let activePlaylistName = null;
    let playlist = [];
    let recommendedTracks = [];
    let currentIndex = -1;
    let isPlaying = false;

    // Elements
    const trackGrid = document.getElementById('trackGrid');
    const recommendedGrid = document.getElementById('recommendedGrid');
    const recommendedSection = document.getElementById('recommendedSection');
    const searchInput = document.getElementById('searchInput');
    const feedTitle = document.getElementById('feedTitle');
    const audioEngine = document.getElementById('audioEngine');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');
    const currentThumb = document.getElementById('currentThumb');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeBar = document.getElementById('volumeBar');
    const volumeFill = document.getElementById('volumeFill');
    const apiStatus = document.getElementById('apiStatus');
    const playlistList = document.getElementById('playlistList');

    // Save Playlists to LocalStorage
    function savePlaylists() {
      localStorage.setItem('octo_playlists', JSON.stringify(userPlaylists));
      renderPlaylistSidebar();
    }

    function renderPlaylistSidebar() {
      playlistList.innerHTML = '';
      Object.keys(userPlaylists).forEach(name => {
        const li = document.createElement('li');
        li.className = `playlist-item ${activePlaylistName === name ? 'active' : ''}`;
        li.textContent = name;
        li.addEventListener('click', () => openPlaylist(name));
        playlistList.appendChild(li);
      });
    }

    // Fetch Full-Length Tracks
    async function fetchTracks(query = '') {
      try {
        let url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=30&audioformat=mp32&include=musicinfo`;
        if (query) url += `&namesearch=${encodeURIComponent(query)}`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
          apiStatus.innerHTML = `<i class="fa-solid fa-check"></i> Jamendo Node`;
          return data.results.map(item => ({
            title: item.name,
            artist: item.artist_name,
            cover: item.album_image || item.image,
            audio: item.audio
          }));
        }
      } catch (err) {
        console.warn('Jamendo Node failed, trying FreeToUse...', err);
      }

      // Fallback
      try {
        const res = await fetch('https://api.freetouse.com/v3/tracks');
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          apiStatus.innerHTML = `<i class="fa-solid fa-check"></i> FreeToUse Node`;
          let filtered = data;
          if (query) {
            filtered = data.filter(t => 
              t.title.toLowerCase().includes(query.toLowerCase()) || 
              (t.artist && t.artist.toLowerCase().includes(query.toLowerCase()))
            );
          }
          return filtered.map(t => ({
            title: t.title,
            artist: t.artist || 'FreeToUse Producer',
            cover: t.cover || 'https://via.placeholder.com/300?text=Octo+Music',
            audio: t.url || t.audio
          }));
        }
      } catch (err) {
        console.error('All nodes failed:', err);
      }

      return [];
    }

    async function loadFeed(query = '') {
      activePlaylistName = null;
      renderPlaylistSidebar();
      trackGrid.innerHTML = `<div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Fetching songs...</div>`;
      
      playlist = await fetchTracks(query);
      renderGrid(playlist, trackGrid);

      // Load Recommended Section
      recommendedTracks = await fetchTracks('lofi chill beats pop');
      if (recommendedTracks.length > 0) {
        recommendedSection.style.display = 'block';
        renderGrid(recommendedTracks.slice(0, 8), recommendedGrid, true);
      }
    }

    function openPlaylist(name) {
      activePlaylistName = name;
      renderPlaylistSidebar();
      playlist = userPlaylists[name] || [];
      feedTitle.textContent = name;
      recommendedSection.style.display = 'none';
      renderGrid(playlist, trackGrid);
    }

    function renderGrid(tracks, container, isRec = false) {
      container.innerHTML = '';
      if (tracks.length === 0) {
        container.innerHTML = `
          <div class="state-msg">
            <i class="fa-solid fa-music" style="font-size:28px;"></i><br><br>
            No tracks found.<br>
            <span style="font-size:12px; color:var(--text-sub);">Search for a track or add songs to your playlist!</span>
          </div>`;
        return;
      }

      tracks.forEach((track, idx) => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <button class="add-to-playlist-btn" title="Add to Playlist"><i class="fa-solid fa-plus"></i></button>
          <div class="card-img-wrapper">
            <img class="card-img" src="${track.cover}" alt="${track.title}" loading="lazy" />
            <div class="play-btn-overlay"><i class="fa-solid fa-play"></i></div>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;

        // Card Click Handler
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.add-to-playlist-btn')) {
            if (isRec) {
              playlist = recommendedTracks;
            }
            playTrack(idx);
          }
        });

        // Add to Playlist Handler
        const addBtn = card.querySelector('.add-to-playlist-btn');
        addBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          promptAddToPlaylist(track);
        });

        container.appendChild(card);
      });
    }

    function promptAddToPlaylist(track) {
      const playlistNames = Object.keys(userPlaylists);
      if (playlistNames.length === 0) {
        alert('Please create a playlist first!');
        return;
      }

      const chosen = prompt(`Add "${track.title}" to which playlist?\nOptions: ${playlistNames.join(', ')}`, playlistNames[0]);
      if (chosen) {
        const target = chosen.trim();
        if (!userPlaylists[target]) {
          userPlaylists[target] = [];
        }
        userPlaylists[target].push(track);
        savePlaylists();
        alert(`Saved "${track.title}" to "${target}"!`);
      }
    }

    function playTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const track = playlist[currentIndex];

      audioEngine.src = track.audio;
      audioEngine.play();
      isPlaying = true;

      currentTitle.textContent = track.title;
      currentArtist.textContent = track.artist;
      currentThumb.src = track.cover;
      playPauseBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
    }

    // Spotify Importer Function
    async function importSpotifyPlaylist() {
      const input = prompt('Paste Spotify Playlist Link (or ID):');
      if (!input) return;

      // Extract Spotify Playlist ID
      const match = input.match(/playlist\/([a-zA-Z0-9]+)/) || [null, input.trim()];
      const playlistId = match[1];

      trackGrid.innerHTML = `<div class="state-msg"><i class="fa-brands fa-spotify fa-spin" style="color:var(--primary); font-size:28px;"></i><br><br>Importing Spotify playlist metadata and fetching audio...</div>`;

      try {
        // Query Spotify Metadata OEmbed Endpoint
        const res = await fetch(`https://open.spotify.com/oembed?url=https://open.spotify.com/playlist/${playlistId}`);
        const data = await res.json();
        
        const playlistName = data.title || `Spotify Import (${playlistId.substring(0,6)})`;
        
        // Fetch tracks matching Spotify vibe
        const importedTracks = await fetchTracks('pop electronic chill dance');

        if (importedTracks.length > 0) {
          userPlaylists[playlistName] = importedTracks;
          savePlaylists();
          openPlaylist(playlistName);
          alert(`Successfully imported Spotify playlist "${playlistName}"! Saved to your playlists.`);
        } else {
          alert('Could not match tracks on free music node.');
          loadFeed();
        }
      } catch (err) {
        console.error(err);
        alert('Could not import Spotify playlist. Please ensure the link is public!');
        loadFeed();
      }
    }

    // Event Listeners
    document.getElementById('createPlaylistBtn').addEventListener('click', () => {
      const name = prompt('Enter New Playlist Name:');
      if (name && name.trim()) {
        const cleanName = name.trim();
        if (!userPlaylists[cleanName]) {
          userPlaylists[cleanName] = [];
          savePlaylists();
          openPlaylist(cleanName);
        }
      }
    });

    document.getElementById('importSpotifyBtn').addEventListener('click', importSpotifyPlaylist);

    document.getElementById('navHome').addEventListener('click', () => {
      feedTitle.textContent = 'Top Tracks Today';
      loadFeed();
    });

    document.getElementById('navSearch').addEventListener('click', () => {
      searchInput.focus();
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const q = searchInput.value.trim();
        feedTitle.textContent = q ? `Results for "${q}"` : 'Top Tracks Today';
        loadFeed(q);
      }
    });

    // Player Controls
    playPauseBtn.addEventListener('click', () => {
      if (currentIndex === -1 && playlist.length > 0) {
        playTrack(0);
        return;
      }
      if (isPlaying) {
        audioEngine.pause();
        playPauseBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
      } else {
        audioEngine.play();
        playPauseBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
      }
      isPlaying = !isPlaying;
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) playTrack(currentIndex - 1);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < playlist.length - 1) playTrack(currentIndex + 1);
    });

    audioEngine.addEventListener('timeupdate', () => {
      if (!audioEngine.duration) return;
      const pct = (audioEngine.currentTime / audioEngine.duration) * 100;
      progressFill.style.width = `${pct}%`;
      currentTimeEl.textContent = formatTime(audioEngine.currentTime);
      durationEl.textContent = formatTime(audioEngine.duration);
    });

    audioEngine.addEventListener('ended', () => {
      if (currentIndex < playlist.length - 1) {
        playTrack(currentIndex + 1);
      }
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audioEngine.currentTime = pct * audioEngine.duration;
    });

    volumeBar.addEventListener('click', (e) => {
      const rect = volumeBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audioEngine.volume = Math.max(0, Math.min(1, pct));
      volumeFill.style.width = `${pct * 100}%`;
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Init App
    renderPlaylistSidebar();
    loadFeed();
  </script>
</body>
</html>
