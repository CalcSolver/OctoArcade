<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octo Music - Multi-Node Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-base: #121212;
      --bg-surface: #181818;
      --bg-highlight: #282828;
      --primary: #1db954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --border-color: #282828;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .app-container { display: flex; flex: 1; height: calc(100vh - 90px); overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 240px; background-color: #000; padding: 24px 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
    .brand { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 12px; }
    .brand i { color: var(--primary); font-size: 24px; }
    
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .nav-item { color: var(--text-sub); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; gap: 14px; align-items: center; transition: color 0.2s; }
    .nav-item:hover, .nav-item.active { color: var(--text-main); }

    .sidebar-divider { height: 1px; background: var(--border-color); margin: 4px 0; }
    .action-btn { width: 100%; padding: 10px; border-radius: 20px; border: none; background: var(--primary); color: #000; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .action-btn:hover { opacity: 0.9; }

    .user-playlists-section h4 { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .playlist-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .playlist-item { color: var(--text-sub); font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
    .playlist-item:hover, .playlist-item.active { color: var(--text-main); }

    /* Main Area */
    .main-content { flex: 1; background: linear-gradient(to bottom, #1e3a29 0%, var(--bg-base) 350px); overflow-y: auto; padding: 24px 32px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    
    .search-box { position: relative; width: 320px; }
    .search-box input { width: 100%; padding: 10px 16px 10px 40px; border-radius: 50px; border: none; background: var(--bg-surface); color: var(--text-main); font-size: 14px; outline: none; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

    .hero-banner h1 { font-size: 32px; font-weight: 800; margin-bottom: 6px; }
    .hero-banner p { color: var(--text-sub); margin-bottom: 24px; }

    /* Track Grid */
    .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .track-card { background: var(--bg-surface); padding: 16px; border-radius: 8px; cursor: pointer; transition: background 0.2s; position: relative; }
    .track-card:hover { background: var(--bg-highlight); }
    
    .card-img-wrap { position: relative; width: 100%; padding-top: 100%; border-radius: 6px; overflow: hidden; margin-bottom: 12px; background: #282828; }
    .card-img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    .play-btn-overlay { position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; opacity: 0; transform: translateY(8px); transition: all 0.2s; }
    .track-card:hover .play-btn-overlay { opacity: 1; transform: translateY(0); }

    .add-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: 0.2s; z-index: 5; }
    .track-card:hover .add-btn { opacity: 1; }
    .add-btn:hover { background: var(--primary); color: #000; }

    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .card-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Player Bar */
    .player-bar { height: 90px; background: #000; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .player-left { display: flex; align-items: center; gap: 14px; width: 30%; }
    .player-left img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: #282828; }
    .player-left .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-left .artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
    .controls { display: flex; gap: 20px; align-items: center; }
    .controls button { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 16px; }
    .controls button:hover { color: var(--text-main); }
    .controls .play-pause { width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    .progress-track { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 400px; font-size: 11px; color: var(--text-sub); }
    .progress-bar { flex: 1; height: 4px; background: #4f4f4f; border-radius: 2px; cursor: pointer; position: relative; }
    .progress-fill { height: 100%; background: #fff; width: 0%; border-radius: 2px; }
    
    .state-msg { text-align: center; grid-column: 1 / -1; padding: 40px 0; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-compact-disc"></i> Octo Music</div>
      <ul class="nav-list">
        <li class="nav-item active" id="navHome"><i class="fa-solid fa-house"></i> Home</li>
      </ul>
      <div class="sidebar-divider"></div>
      <button class="action-btn" id="createPlaylistBtn"><i class="fa-solid fa-plus"></i> New Playlist</button>
      <div class="user-playlists-section" style="margin-top: 15px;">
        <h4>Your Playlists</h4>
        <ul class="playlist-list" id="playlistList"></ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search mainstream songs..." />
        </div>
      </div>

      <div class="hero-banner">
        <h1 id="feedTitle">Top Hits</h1>
        <p>Search mainstream tracks with multi-node API failover</p>
      </div>

      <div class="track-grid" id="trackGrid">
        <div class="state-msg">Loading music library...</div>
      </div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="player-left">
      <img id="currImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' fill='%23282828'><rect width='56' height='56'/></svg>" />
      <div>
        <div class="title" id="currTitle">No Track Playing</div>
        <div class="artist" id="currArtist">Select a song</div>
      </div>
    </div>
    
    <div class="player-center">
      <div class="controls">
        <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-pause" id="playBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-track">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </div>
    <div style="width: 30%;"></div>
  </footer>

  <audio id="audioEngine"></audio>

  <script>
    // List of multiple public fallback instances to prevent rate limits
    const NODES = [
      'https://vid.puffyan.us',
      'https://invidious.privacy.gd',
      'https://inv.nadeko.net'
    ];

    let userPlaylists = JSON.parse(localStorage.getItem('octo_playlists') || '{"Favorites": []}');
    let activePlaylist = null;
    let currentTracks = [];
    let currentIndex = -1;
    let isPlaying = false;

    const audio = document.getElementById('audioEngine');
    const trackGrid = document.getElementById('trackGrid');
    const searchInput = document.getElementById('searchInput');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const currTitle = document.getElementById('currTitle');
    const currArtist = document.getElementById('currArtist');
    const currImg = document.getElementById('currImg');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const playlistList = document.getElementById('playlistList');

    function savePlaylists() {
      localStorage.setItem('octo_playlists', JSON.stringify(userPlaylists));
      renderPlaylists();
    }

    function renderPlaylists() {
      playlistList.innerHTML = '';
      Object.keys(userPlaylists).forEach(name => {
        const li = document.createElement('li');
        li.className = `playlist-item ${activePlaylist === name ? 'active' : ''}`;
        li.textContent = `${name} (${userPlaylists[name].length})`;
        li.onclick = () => openPlaylist(name);
        playlistList.appendChild(li);
      });
    }

    async function fetchMusic(query = 'Top Hits 2026') {
      activePlaylist = null;
      renderPlaylists();
      trackGrid.innerHTML = '<div class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Connecting to music nodes...</div>';

      let data = null;
      let workingNode = '';

      // Automatically rotate through nodes if one fails or rate limits
      for (const node of NODES) {
        try {
          const res = await fetch(`${node}/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
          if (res.ok) {
            data = await res.json();
            workingNode = node;
            break;
          }
        } catch (e) {
          console.warn(`Node ${node} failed, trying next...`);
        }
      }

      if (data && data.length > 0) {
        currentTracks = data.map(item => ({
          title: item.title,
          artist: item.author,
          cover: item.videoThumbnails && item.videoThumbnails[0] ? item.videoThumbnails[0].url : '',
          audio: `${workingNode}/latest_version?id=${item.videoId}&itag=140`
        })).filter(t => t.cover);

        renderGrid(currentTracks);
      } else {
        trackGrid.innerHTML = '<div class="state-msg">All nodes busy or rate limited. Try searching again in a moment!</div>';
      }
    }

    function openPlaylist(name) {
      activePlaylist = name;
      renderPlaylists();
      currentTracks = userPlaylists[name] || [];
      document.getElementById('feedTitle').textContent = name;
      renderGrid(currentTracks);
    }

    function renderGrid(tracks) {
      trackGrid.innerHTML = '';
      if (tracks.length === 0) {
        trackGrid.innerHTML = '<div class="state-msg">No tracks found.</div>';
        return;
      }

      tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <button class="add-btn" title="Add to Playlist"><i class="fa-solid fa-plus"></i></button>
          <div class="card-img-wrap">
            <img src="${track.cover}" loading="lazy" />
            <div class="play-btn-overlay"><i class="fa-solid fa-play"></i></div>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;

        card.onclick = (e) => {
          if (!e.target.closest('.add-btn')) playTrack(index);
        };

        card.querySelector('.add-btn').onclick = (e) => {
          e.stopPropagation();
          addToPlaylist(track);
        };

        trackGrid.appendChild(card);
      });
    }

    function addToPlaylist(track) {
      const names = Object.keys(userPlaylists);
      const target = prompt(`Add to which playlist?\n- ` + names.join('\n- '), names[0]);
      if (target && userPlaylists[target]) {
        userPlaylists[target].push(track);
        savePlaylists();
        alert(`Added "${track.title}" to ${target}!`);
      }
    }

    function playTrack(index) {
      currentIndex = index;
      const track = currentTracks[currentIndex];
      audio.src = track.audio;
      audio.play();
      isPlaying = true;
      playIcon.className = "fa-solid fa-pause";
      currTitle.textContent = track.title;
      currArtist.textContent = track.artist;
      currImg.src = track.cover;
    }

    playBtn.onclick = () => {
      if (!audio.src && currentTracks.length > 0) { playTrack(0); return; }
      if (isPlaying) {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
      } else {
        audio.play();
        playIcon.className = "fa-solid fa-pause";
      }
      isPlaying = !isPlaying;
    };

    document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) playTrack(currentIndex - 1); };
    document.getElementById('nextBtn').onclick = () => { if (currentIndex < currentTracks.length - 1) playTrack(currentIndex + 1); };

    audio.ontimeupdate = () => {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('duration').textContent = formatTime(audio.duration);
      }
    };

    audio.onended = () => {
      if (currentIndex < currentTracks.length - 1) playTrack(currentIndex + 1);
    };

    progressBar.onclick = (e) => {
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / progressBar.offsetWidth) * audio.duration;
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    document.getElementById('createPlaylistBtn').onclick = () => {
      const name = prompt('Enter new playlist name:');
      if (name && name.trim() && !userPlaylists[name.trim()]) {
        userPlaylists[name.trim()] = [];
        savePlaylists();
        openPlaylist(name.trim());
      }
    };

    document.getElementById('navHome').onclick = () => {
      document.getElementById('feedTitle').textContent = 'Top Hits';
      fetchMusic('Top Hits 2026');
    };

    searchInput.onkeypress = (e) => {
      if (e.key === 'Enter') {
        document.getElementById('feedTitle').textContent = `Results for "${searchInput.value}"`;
        fetchMusic(searchInput.value);
      }
    };

    // Initialize App
    renderPlaylists();
    fetchMusic('Top Hits 2026');
  </script>
</body>
</html>
