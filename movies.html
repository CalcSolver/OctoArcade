<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Screen Iframe</title>
  <style>
    /* Remove default browser margins and hide global scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
    }

    /* Force the iframe to fill the exact viewport dimensions */
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block; /* Eliminates the default inline bottom gap */
    }
  </style>
</head>
<body>

  <iframe src="https://tuesdae.vercel.app/movies.html"></iframe>

</body>
</html>
