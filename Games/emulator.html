<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 1rem;
            background-color: #1f1f1f;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            padding: 2rem 1rem 1rem 1rem;
        }
        .emulator-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
        .controls {
            margin-top: 1rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, label.file-upload {
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
        }
        button:hover, label.file-upload:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            display: none;
        }
        /* Options Menu Styling */
        .options-menu {
            display: none;
            width: 100%;
            margin-top: 1rem;
            padding: 1rem;
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 6px;
        }
        .options-menu.active {
            display: block;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            margin-top: 8px;
            margin-bottom: 8px;
            resize: vertical;
        }
    </style>
</head>
<body>

    <header>
        <h1>Emulator</h1>
    </header>

    <main>
        <div class="emulator-container">
            <iframe id="emulator-frame" title="Emulator Display"></iframe>
        </div>

        <div class="controls">
            <label class="file-upload">
                Upload File
                <input type="file" id="file-input" onchange="loadFile(event)">
            </label>

            <button onclick="toggleOptions()">Options Menu</button>
            <button onclick="toggleFullscreen()">Fullscreen</button>
            <button onclick="reloadEmulator()">Reload</button>
        </div>

        <div id="options-menu" class="options-menu">
            <h3>Options & Custom Code</h3>
            <p style="font-size: 0.9rem; color: #ccc; margin-top: 4px;">Paste HTML or JavaScript below to render in the emulator viewport:</p>
            <textarea id="code-input" placeholder="<html><body><h1>Hello World</h1></body></html>"></textarea>
            <button onclick="loadPastedCode()">Load Code</button>
        </div>
    </main>

    <script>
        // Load local file uploaded by user
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const frame = document.getElementById('emulator-frame');
                frame.srcdoc = e.target.result;
            };
            reader.readAsText(file);
        }

        // Load custom code pasted in options text area
        function loadPastedCode() {
            const code = document.getElementById('code-input').value;
            const frame = document.getElementById('emulator-frame');
            frame.srcdoc = code;
        }

        // Toggle Options Menu visibility
        function toggleOptions() {
            const menu = document.getElementById('options-menu');
            menu.classList.toggle('active');
        }

        // Fullscreen toggle
        function toggleFullscreen() {
            const iframe = document.getElementById('emulator-frame');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) { /* Safari */
                iframe.webkitRequestFullscreen();
            }
        }

        // Reload iframe content
        function reloadEmulator() {
            const iframe = document.getElementById('emulator-frame');
            iframe.srcdoc = iframe.srcdoc;
        }
    </script>

</body>
</html>
