<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen iFrame</title>
    <style>
        /* Remove default browser margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }

        /* Make the iframe cover the entire viewport */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block; /* Removes unwanted bottom whitespace */
        }
    </style>
</head>
<body>

    <iframe src="https://raw.githack.com/ovo-gamez-unblocked/stickman-boost/main/index.html"></iframe>

</body>
</html>
